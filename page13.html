<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复核报告归档 · 合同对比助手</title>
<script src="tailwind.js"></script>
<style>
  :root{
    --brand:#165DFF; --brand-weak:#E8F3FF; --ink-1:#1D2129; --ink-2:#4E5969; --ink-3:#86909C;
    --line:#E5E6EB; --bg:#F7F8FA; --card:#fff;
    --c-add:#B3E8C0; --c-del:#FFBFBF; --c-mod:#FFD9A8;
    --risk-high:#F53F3F; --risk-mid:#D25F00; --risk-low:#00875A; --risk-none:#86909C;
    --review-bg:#E9D5FF; --review-text:#6B21A8; --review-bd:#9333EA;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink-1);background:var(--bg);font-size:13px;}
  .app{display:flex;flex-direction:row;height:100vh;overflow:hidden;}
  /* 侧边导航（全站统一 9 项） */
  .sidebar{width:220px;flex:0 0 220px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .18s ease;min-height:0;}
  .sidebar.collapsed{width:64px;flex-basis:64px;}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);height:56px;white-space:nowrap;overflow:hidden;}
  .sidebar.collapsed .sb-brand span{display:none;}
  .logo{width:30px;height:30px;border-radius:6px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 30px;}
  .sb-nav{flex:1;overflow:auto;padding:8px;min-height:0;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--ink-2);cursor:pointer;margin-bottom:2px;white-space:nowrap;overflow:hidden;}
  .sb-item:hover{background:var(--bg);}
  .sb-item.active{background:var(--brand-weak);color:var(--brand);font-weight:600;}
  .sb-sub{padding-left:34px;font-size:13px;color:var(--ink-3);}
  .sb-sub .ico{opacity:.5;}
  .sb-sub:hover{background:var(--bg);}
  .sb-sub.active{background:var(--brand-weak);color:var(--brand);font-weight:600;}
  .sidebar.collapsed .sb-sub span{display:none;}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink-2);}
  .sb-item .ico{width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;}
  .sidebar.collapsed .sb-item span{display:none;}
  .sb-foot{padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);line-height:1.7;white-space:nowrap;overflow:hidden;}
  .sidebar.collapsed .sb-foot{display:none;}
  .sb-toggle{position:absolute;top:64px;left:206px;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;color:var(--ink-3);transition:left .18s ease;}
  .sidebar.collapsed .sb-toggle{left:50px;}
  /* 主区 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
  .topbar{height:56px;flex:0 0 56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;}
  .topbar h1{font-size:16px;margin:0;}
  .topbar .crumb{font-size:12px;color:var(--ink-3);margin-top:2px;}
  .top-right{display:flex;align-items:center;gap:12px;}
  .role-sel{border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:12px;color:var(--ink-1);background:#fff;}
  .content{flex:1;overflow:auto;padding:18px;}
  .lock-note{font-size:12px;color:var(--ink-3);}
  /* 统计卡 */
  .stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 18px;min-width:120px;}
  .stat .n{font-size:22px;font-weight:700;}
  .stat .l{font-size:12px;color:var(--ink-3);margin-top:2px;}
  .stat.add .n{color:var(--risk-low);} .stat.del .n{color:var(--risk-high);}
  .stat.mod .n{color:var(--risk-mid);} .stat.same .n{color:var(--ink-3);}
  .sec-title{font-size:14px;font-weight:600;color:var(--ink-1);margin:18px 0 10px;display:flex;align-items:center;gap:8px;}
  .sec-title .line{width:3px;height:14px;background:var(--brand);border-radius:2px;}
  /* 筛选条 */
  .filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:14px;}
  .f-input,.f-select{border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:13px;color:var(--ink-1);background:#fff;}
  .f-input{min-width:220px;}
  .spacer{flex:1;}
  /* 按钮 */
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink-1);border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer;}
  .btn:hover{background:var(--bg);}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn-primary:hover{background:#0E4AD0;}
  .btn-sm{padding:3px 8px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  /* 表格 */
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
  th{background:#FAFBFC;color:var(--ink-3);font-weight:600;font-size:12px;}
  th.th-sort{cursor:pointer;user-select:none;}
  th .si{color:var(--brand);font-size:11px;margin-left:2px;}
  tbody tr{cursor:default;transition:background .12s;}
  tbody tr:hover{background:var(--brand-weak);}
  .op{display:flex;gap:6px;flex-wrap:wrap;}
  .empty{padding:32px;text-align:center;color:var(--ink-3);}
  .col-check{width:38px;text-align:center;}
  .sel-info{font-size:12px;color:var(--brand);font-weight:600;}
  .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:260px;}
  /* 标签 */
  .tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;line-height:1.5;}
  .t-review{background:var(--review-bg);color:var(--review-text);border:1px solid var(--review-bd);}
  .t-cat{background:#F2F3F5;color:var(--ink-2);}
  .t-risk{color:#fff;}
  .t-high{background:var(--risk-high);} .t-mid{background:var(--risk-mid);} .t-low{background:var(--risk-low);} .t-none{background:var(--risk-none);}
  .t-add{background:var(--c-add);color:var(--ink-1);}
  .t-del{background:var(--c-del);color:var(--ink-1);}
  .t-mod{background:var(--c-mod);color:var(--ink-1);}
  .t-same{background:#F2F3F5;color:var(--ink-2);}
  .t-active{background:var(--c-add);color:var(--ink-1);}
  .t-draft{background:#F2F3F5;color:var(--ink-2);}
  /* 双栏 / 详情 */
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:920px){ .two-col{grid-template-columns:1fr;} }
  .blk{border:1px solid var(--line);border-radius:6px;padding:10px 12px;}
  .blk .bt{font-size:12px;font-weight:600;margin-bottom:8px;color:var(--ink-2);display:flex;align-items:center;gap:6px;}
  .blk .bt .dot{width:8px;height:8px;border-radius:50%;}
  .blk .row{display:flex;gap:8px;font-size:12px;padding:3px 0;}
  .blk .row .k{color:var(--ink-3);min-width:64px;flex:0 0 64px;}
  .blk .row .v{color:var(--ink-1);}
  .readonly{background:#FAFBFC;}
  .op-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  /* 分页 */
  .pager{display:flex;gap:6px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap;}
  /* 权限显隐 */
  .role-procurement .mgr-only{display:none;}
  .role-legal .mgr-only{display:none;}
  .role-procurement .col-check{display:none;}
  /* 弹窗 / toast */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:100;}
  .modal-mask.show{display:flex;}
  .modal-box{position:relative;}
  .modal{background:#fff;border-radius:8px;width:min(760px,94vw);max-height:88vh;overflow:auto;padding:22px;}
  .modal h3{margin:0 0 14px;font-size:16px;}
  .modal-close{position:absolute;top:-14px;right:-14px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:20px;line-height:1;color:var(--ink-3);cursor:pointer;border-radius:6px;z-index:2;}
  .modal-close:hover{background:#F2F3F5;color:var(--ink-1);}
  .toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(29,33,41,.92);color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;}
  .toast.show{opacity:1;}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:4px;width:30px;height:30px;cursor:pointer;color:var(--ink-2);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 30px;}
.icon-btn:hover{border-color:var(--brand);color:var(--brand);}
.topbar{gap:12px;}
.top-right{margin-left:auto;}
.sidebar.collapsed .sb-item span,.sidebar.collapsed .sb-sub span{display:none;}

  /* 二级菜单手风琴 */
  .sb-children{display:none;}
  .sb-group.open .sb-children{display:block;}
  .sb-caret{margin-left:auto;font-size:11px;line-height:1;color:var(--ink-3);transition:transform .15s;transform:rotate(0deg);}
  .sb-group.open > .sb-parent .sb-caret{transform:rotate(90deg);}
  .sb-children .sb-sub{padding-left:32px;}
  .sidebar.collapsed .sb-children{display:none!important;}
  .sidebar.collapsed .sb-caret{display:none;}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边导航（全站统一） -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><div class="logo">C</div><span>合同对比助手</span></div>
          <div class="sb-nav" id="sbNav">
        <div class="sb-group" data-group="ledger">
          <div class="sb-item sb-parent" data-nav="ledger"><span class="ico">▤</span><span>合同台账</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="detail"><span class="ico">›</span><span>合同详情</span></div>
          </div>
        </div>
        <div class="sb-group" data-group="tasks">
          <div class="sb-item sb-parent" data-nav="tasks"><span class="ico">☰</span><span>比对任务管理</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="new"><span class="ico">＋</span><span>新建比对任务</span></div>
            <div class="sb-sub" data-nav="review"><span class="ico">✎</span><span>对比复核页</span></div>
          </div>
        </div>
        <div class="sb-group" data-group="std">
          <div class="sb-item sb-parent" data-nav="std"><span class="ico">📘</span><span>标准条款库</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="clauseDetail"><span class="ico">›</span><span>条款详情&amp;版本对比</span></div>
          </div>
        </div>
        <div class="sb-item" data-nav="risk"><span class="ico">⚠</span><span>风险条款库</span></div>
        <div class="sb-item" data-nav="eval"><span class="ico">📊</span><span>评测集管理</span></div>
        <div class="sb-group" data-group="qc">
          <div class="sb-item sb-parent" data-nav="qc"><span class="ico">✓</span><span>双盲审核工单</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="truthWO" title="复核工单详情"><span class="ico">›</span><span>复核工单详情</span></div>
          </div>
        </div>
        <div class="sb-item" data-nav="rule"><span class="ico">⚙</span><span>风控规则配置</span></div>
        <div class="sb-group" data-group="archive">
          <div class="sb-item sb-parent active" data-nav="archive"><span class="ico">🗄</span><span>复核报告归档</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="reportDetail"><span class="ico">›</span><span>复核报告详情</span></div>
          </div>
        </div>
        <div class="sb-item sb-admin-only" data-nav="setting" style="display:none;"><span class="ico">⚷</span><span>系统权限设置</span></div>
      </div>
    <div class="sb-foot">一期 规则引擎+差异模型<br>二期 样本相似度+难例挖掘<br>无大模型自动解读</div>
  </aside>
  <div class="main">
    <div class="topbar">
        <button class="icon-btn" id="sbToggle" title="收起/展开侧边栏">☰</button>
        <button class="icon-btn" id="backBtn" title="返回上一页" onclick="history.back()">‹</button>
      <div>
        <h1>复核报告归档</h1>
        <div class="crumb">合同对比助手 / 复核报告归档（法务复核完成、闭环归档后只读）</div>
      </div>
      <div class="top-right">
        <span class="lock-note" id="permHint"></span>
        <label class="lock-note">角色</label>
        <select class="role-sel" id="roleSel">
          <option value="procurement">采购专员</option>
          <option value="legal" selected>法务审核员</option>
          <option value="admin">管理员</option>
        </select>
      </div>
    </div>

    <div class="content">
      <!-- 采购只读提示 -->
      <div class="lock-note" id="readOnlyTip" style="display:none;background:#F2F3F5;border-radius:4px;padding:8px 12px;margin-bottom:12px;">采购专员仅可查看归档报告与溯源，导出功能受限。</div>

      <!-- 统计 -->
      <div class="stats" id="stats"></div>

      <!-- 筛选 + 快捷操作 -->
      <div class="filterbar">
        <input class="f-input" id="kw" placeholder="搜索 归档编号 / 合同名称 / 供应商 / 复核人">
        <select class="f-select" id="fMode">
          <option value="">全部比对模式</option>
          <option value="stdSup">标准合同 VS 供应商合同</option>
          <option value="extExt">外部合同 VS 外部合同</option>
          <option value="extStd">外部合同 VS 标准条款</option>
        </select>
        <select class="f-select" id="fRisk">
          <option value="">全部最高风险等级</option>
          <option value="high">高风险</option>
          <option value="mid">中风险</option>
          <option value="low">低风险</option>
          <option value="none">无风险</option>
        </select>
        <select class="f-select" id="fTime">
          <option value="">全部归档时间</option>
          <option value="7">近 7 天</option>
          <option value="30">近 30 天</option>
          <option value="old">30 天前</option>
        </select>
        <select class="f-select" id="fReviewer">
          <option value="">全部复核人</option>
          <option value="法务-王敏">法务-王敏</option>
          <option value="法务-李强">法务-李强</option>
        </select>
        <select class="f-select" id="fType">
          <option value="">全部合同类型</option>
          <option value="采购合同">采购合同</option>
          <option value="服务合同">服务合同</option>
          <option value="框架协议">框架协议</option>
        </select>
        <div class="spacer"></div>
        <button class="btn" id="refreshBtn">刷新</button>
      </div>

      <!-- 归档列表 -->
      <div class="sec-title"><span class="line"></span>复核报告归档列表
        <span class="spacer" style="flex:1;"></span>
        <span class="sel-info" id="selInfo" style="display:none;"></span>
        <button class="btn btn-primary" id="batchExportBtn" disabled>批量导出</button>
        <button class="btn" id="clearSelBtn" style="display:none;">取消选择</button>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th class="col-check"><input type="checkbox" id="checkAll"></th>
              <th class="th-sort" data-sort="id" onclick="setSort('id')">归档编号 <span class="si"></span></th>
              <th>合同名称</th>
              <th>供应商名称</th>
              <th>比对模式</th>
              <th class="th-sort" data-sort="risk" onclick="setSort('risk')">最高风险等级 <span class="si"></span></th>
              <th class="th-sort" data-sort="diff" onclick="setSort('diff')">差异总条数 <span class="si"></span></th>
              <th>复核人</th>
              <th class="th-sort" data-sort="time" onclick="setSort('time')">归档时间 <span class="si"></span></th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="emptyTip" style="display:none;">无匹配的归档报告</div>
        <div class="pager" id="pager"></div>
      </div>
    </div>
  </div>
</div>

<!-- 查看归档报告弹窗 -->
<div class="modal-mask" id="reportMask">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('reportMask')" aria-label="关闭">×</button>
    <div class="modal" id="reportBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const NAV = {

const ROLE_LABEL = {procurement:'采购专员（仅查看）', legal:'法务审核员（可单条导出）', admin:'管理员 / 法务负责人（可批量导出）'};

const RISK_LABEL={high:'高风险',mid:'中风险',low:'低风险',none:'无风险'};

const MODE_LABEL={stdSup:'标准合同 VS 供应商合同', extExt:'外部合同 VS 外部合同', extStd:'外部合同 VS 标准条款'};
const ST_LABEL={add:'新增',del:'删除',mod:'修改',same:'一致'};
const ST_TAG={add:'t-add',del:'t-del',mod:'t-mod',same:'t-same'};

/* 归档数据：法务复核完成、闭环归档后只读 */
const ARCHIVES = [

     {clause:'第5.2条 价款与支付', status:'mod', risk:'high', opinion:'账期由30日收紧至60日，评估供应商资金占用，维持高风险。'},
     {clause:'第8.3条 违约责任', status:'del', risk:'high', opinion:'删除原高额违约金条款，违约约束削弱，建议保留或替代。'},

     {clause:'第6.1条 质量保证', status:'mod', risk:'mid', opinion:'质量标准由国标改国际标准，确认等效后风险可控。'},

     {clause:'第10.2条 知识产权', status:'add', risk:'mid', opinion:'新增改进技术权属归乙方，评估甲方使用限制。'}
   ]},
  {id:'AR-2026-003', name:'智能仓储设备采购合同', supplier:'深圳智仓自动化有限公司', modeKey:'stdSup', type:'采购合同',

const TODAY = new Date('2026-11-06');
function daysAgo(dateStr){ const d=new Date(dateStr); return Math.floor((TODAY - d)/86400000); }

const state = { role:'legal', kw:'', mode:'', risk:'', time:'', reviewer:'', type:'', sortKey:'time', sortDir:'desc', page:1, selected:new Set() };
const PAGE_SIZE = 5;

function go(url){ window.location.href = url + (url.indexOf('?')>-1?'&':'?') + 'role=' + state.role; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function showModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function row(k,v){ return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }
function stat(n,l,cls){ return '<div class="stat '+cls+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }

/* 筛选 */
function filtered(){
  const kw=state.kw.trim().toLowerCase();
  return ARCHIVES.filter(a=>{
    if(kw && !(a.id.toLowerCase().includes(kw)||a.name.toLowerCase().includes(kw)||a.supplier.toLowerCase().includes(kw)||a.reviewer.toLowerCase().includes(kw))) return false;
    if(state.mode && a.modeKey!==state.mode) return false;
    if(state.risk && a.risk!==state.risk) return false;
    if(state.reviewer && a.reviewer!==state.reviewer) return false;
    if(state.type && a.type!==state.type) return false;
    if(state.time){
      const da=daysAgo(a.time);
      if(state.time==='7' && da>7) return false;
      if(state.time==='30' && da>30) return false;
      if(state.time==='old' && da<=30) return false;
    }
    return true;
  });
}

/* 排序 */
function sorted(list){
  const dir = state.sortDir==='asc'?1:-1;
  const rank={high:3,mid:2,low:1,none:0};
  const k=state.sortKey;
  return list.slice().sort((a,b)=>{
    let va,vb;
    if(k==='id'){va=a.id;vb=b.id;}
    else if(k==='risk'){va=rank[a.risk];vb=rank[b.risk];}
    else if(k==='diff'){va=a.diffCount;vb=b.diffCount;}
    else {va=a.time;vb=b.time;}
    if(va<vb) return -1*dir; if(va>vb) return 1*dir; return 0;
  });
}
function setSort(k){
  if(state.sortKey===k){ state.sortDir = state.sortDir==='asc'?'desc':'asc'; }
  else { state.sortKey=k; state.sortDir='desc'; }
  state.page=1; renderTable();
}
function updateSortIndicators(){
  document.querySelectorAll('th.th-sort').forEach(th=>{
    const si=th.querySelector('.si'); if(!si) return;
    si.textContent = (th.dataset.sort===state.sortKey) ? (state.sortDir==='asc'?'▲':'▼') : '';
  });
}

/* 统计 */
function renderStats(){
  const total=ARCHIVES.length;
  const monthNew=ARCHIVES.filter(a=>daysAgo(a.time)<=30).length;
  const high=ARCHIVES.filter(a=>a.risk==='high').length;
  document.getElementById('stats').innerHTML=[
    stat(total,'已归档报告','same'),
    stat(monthNew,'近30天新增','add'),
    stat(high,'含高风险','del'),
    stat(total,'待批量导出','mod')
  ].join('');
}

/* 操作按钮（3 个，依次：查看摘要 / 查看复核报告详情（跳页面8）/ 溯源复核对比（跳页面5只读）） */
function opBtns(a){
  let h='';
  h+='<button class="btn btn-sm" onclick="openSummary(\''+a.id+'\')">查看摘要</button>';
  h+='<button class="btn btn-sm btn-primary" onclick="go(\'page8.html?archiveId='+a.id+'\')">查看复核报告详情</button>';
  h+='<button class="btn btn-sm" onclick="traceReview(\''+a.id+'\')">溯源复核对比</button>';
  return '<div class="op">'+h+'</div>';
}

/* 列表 + 分页 */
function renderTable(){
  const list=sorted(filtered());
  const totalPages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));
  if(state.page>totalPages) state.page=totalPages;
  const start=(state.page-1)*PAGE_SIZE;
  const pageList=list.slice(start,start+PAGE_SIZE);
  const tb=document.getElementById('tbody');
  updateSortIndicators();
  if(!list.length){ tb.innerHTML=''; document.getElementById('emptyTip').style.display='block'; document.getElementById('pager').innerHTML=''; return; }
  document.getElementById('emptyTip').style.display='none';
  tb.innerHTML=pageList.map(a=>{
    return '<tr>'+
      '<td class="col-check"><input type="checkbox" class="row-check" data-id="'+a.id+'" '+(state.selected.has(a.id)?'checked':'')+'></td>'+
      '<td class="code">'+a.id+'</td>'+
      '<td><div class="clamp">'+a.name+'</div></td>'+
      '<td>'+a.supplier+'</td>'+
      '<td>'+MODE_LABEL[a.modeKey]+'</td>'+
      '<td><span class="tag '+RISK_TAG[a.risk]+' t-risk">'+RISK_LABEL[a.risk]+'</span></td>'+
      '<td>'+a.diffCount+'</td>'+
      '<td>'+a.reviewer+'</td>'+
      '<td class="code">'+a.time+'</td>'+
      '<td>'+opBtns(a)+'</td>'+
    '</tr>';
  }).join('');
  renderPager(totalPages,list.length);
}
function renderPager(totalPages,total){
  let h='<span style="color:var(--ink-3);font-size:12px;margin-right:8px;">共 '+total+' 条 · 第 '+state.page+'/'+totalPages+' 页</span>';
  h+='<button class="btn btn-sm" '+(state.page<=1?'disabled':'')+' onclick="gotoPage('+(state.page-1)+')">上一页</button>';
  for(let i=1;i<=totalPages;i++){ h+='<button class="btn btn-sm '+(i===state.page?'btn-primary':'')+'" onclick="gotoPage('+i+')">'+i+'</button>'; }
  h+='<button class="btn btn-sm" '+(state.page>=totalPages?'disabled':'')+' onclick="gotoPage('+(state.page+1)+')">下一页</button>';
  document.getElementById('pager').innerHTML=h;
}
function gotoPage(p){ state.page=p; renderTable(); }
function updateSelUI(){
  const n=state.selected.size;
  const info=document.getElementById('selInfo');
  info.textContent = n>0 ? ('已选中 '+n+' 条') : '';
  info.style.display = n>0 ? 'inline' : 'none';
  document.getElementById('batchExportBtn').disabled = (n===0);
  document.getElementById('clearSelBtn').style.display = n>0 ? 'inline-block' : 'none';
  const all=document.querySelectorAll('#tbody .row-check');
  const checked=document.querySelectorAll('#tbody .row-check:checked');
  const ca=document.getElementById('checkAll');
  if(ca){ ca.checked = all.length>0 && all.length===checked.length; ca.indeterminate = checked.length>0 && checked.length<all.length; }
}

/* 取消选择：清空勾选集合并刷新 */
function clearSel(){
  state.selected.clear();
  renderTable(); updateSelUI();
}

/* 查看摘要（轻量弹窗：基础信息 + 差异概览） */
function openSummary(id){
  const a=ARCHIVES.find(x=>x.id===id); if(!a) return;
  const cnt={add:0,del:0,mod:0,same:0};
  a.diffs.forEach(d=>cnt[d.status]++);
  const overview=a.diffs.map(d=>'<tr>'+
    '<td>'+d.clause+'</td>'+
    '<td><span class="tag '+ST_TAG[d.status]+'">'+ST_LABEL[d.status]+'</span></td>'+
    '<td><span class="tag '+RISK_TAG[d.risk]+' t-risk">'+RISK_LABEL[d.risk]+'</span></td>'+
  '</tr>').join('');
  document.getElementById('reportBody').innerHTML=
    '<h3>复核报告摘要 · '+a.id+'</h3>'+
    '<div class="two-col" style="margin-bottom:12px;">'+
      '<div class="blk readonly">'+
        row('合同名称',a.name)+row('供应商',a.supplier)+
        row('比对模式',MODE_LABEL[a.modeKey])+row('合同类型',a.type)+
      '</div>'+
      '<div class="blk readonly">'+
        row('复核人',a.reviewer)+row('归档时间',a.time)+
        row('最高风险等级','<span class="tag '+RISK_TAG[a.risk]+' t-risk">'+RISK_LABEL[a.risk]+'</span>')+
        row('差异总条数',a.diffCount+' 条')+
      '</div>'+
    '</div>'+
    '<div class="sec-title" style="margin-top:6px;"><span class="line"></span>差异概览（'+cnt.add+' 新增 / '+cnt.del+' 删除 / '+cnt.mod+' 修改 / '+cnt.same+' 一致）</div>'+
    '<div class="card"><table><thead><tr><th>条款</th><th>差异状态</th><th>风险等级</th></tr></thead><tbody>'+overview+'</tbody></table></div>'+
    '<div class="op-row"><button class="btn" onclick="closeModal(\'reportMask\')">关闭</button>'+
    '<button class="btn btn-primary" onclick="go(\'page8.html?archiveId='+a.id+'\')">查看完整复核报告详情</button></div>';
  showModal('reportMask');
}

/* 溯源复核详情：跳转页面5 只读快照 */
function traceReview(id){ go('page5.html?readonly=1&archiveId='+id); }

/* 导出 */
function batchExport(){
  if(state.role!=='admin'){ toast('仅管理员 / 法务负责人可批量导出'); return; }
  if(state.selected.size===0){ toast('请先勾选要导出的归档'); return; }
  toast('正在批量导出 '+state.selected.size+' 份归档报告（演示）');
}

function renderAll(){ renderStats(); renderTable(); }

/* 权限 */
function applyPerm(){
  document.body.classList.toggle('role-procurement', state.role==='procurement');
  document.body.classList.toggle('role-legal', state.role==='legal');
  document.body.classList.toggle('role-admin', state.role==='admin');
  document.getElementById('permHint').textContent=ROLE_LABEL[state.role];
  document.getElementById('readOnlyTip').style.display = state.role==='procurement'?'block':'none';
  document.querySelectorAll('.sb-admin-only').forEach(el=>{ el.style.display = state.role==='admin'?'flex':'none'; });
  if(state.role==='procurement') state.selected.clear();
  renderTable(); updateSelUI();
}

/* 绑定 */
function bind(){
  document.getElementById('kw').addEventListener('input',e=>{state.kw=e.target.value;state.page=1;renderTable();});
  document.getElementById('fMode').addEventListener('change',e=>{state.mode=e.target.value;state.page=1;renderTable();});
  document.getElementById('fRisk').addEventListener('change',e=>{state.risk=e.target.value;state.page=1;renderTable();});
  document.getElementById('fTime').addEventListener('change',e=>{state.time=e.target.value;state.page=1;renderTable();});
  document.getElementById('fReviewer').addEventListener('change',e=>{state.reviewer=e.target.value;state.page=1;renderTable();});
  document.getElementById('fType').addEventListener('change',e=>{state.type=e.target.value;state.page=1;renderTable();});
  document.getElementById('roleSel').addEventListener('change',e=>{state.role=e.target.value;applyPerm();});
  document.getElementById('refreshBtn').addEventListener('click',()=>{
    state.kw='';state.mode='';state.risk='';state.time='';state.reviewer='';state.type='';state.page=1;state.sortKey='time';state.sortDir='desc';
    document.getElementById('kw').value='';
    ['fMode','fRisk','fTime','fReviewer','fType'].forEach(id=>document.getElementById(id).value='');
    renderAll(); toast('已刷新归档列表（演示）');
  });
  document.getElementById('batchExportBtn').addEventListener('click',batchExport);
  document.getElementById('clearSelBtn').addEventListener('click',clearSel);
  const tbodyEl=document.getElementById('tbody');
  tbodyEl.addEventListener('change',e=>{
    const cb=e.target.closest('.row-check'); if(!cb) return;
    const id=cb.dataset.id;
    if(cb.checked) state.selected.add(id); else state.selected.delete(id);
    updateSelUI();
  });
  const caEl=document.getElementById('checkAll');
  if(caEl){ caEl.addEventListener('change',e=>{
    const ck=e.target.checked;
    document.querySelectorAll('#tbody .row-check').forEach(cb=>{
      const id=cb.dataset.id;
      if(ck) state.selected.add(id); else state.selected.delete(id);
      cb.checked=ck;
    });
    updateSelUI();
  }); }
  document.getElementById('sbToggle').addEventListener('click',()=>{
    const sb=document.getElementById('sidebar'); sb.classList.toggle('collapsed');
    document.getElementById('sbToggle').textContent=sb.classList.contains('collapsed')?'⟩':'⟨';
  });
  document.querySelectorAll('.sb-item[data-nav], .sb-sub[data-nav]').forEach(it=>{
    it.addEventListener('click',()=>{
      const nav=it.dataset.nav; const cfg=NAV[nav];
      if(cfg&&cfg.page) return;
      if(cfg&&cfg.url){ go(cfg.url); return; }
      toast('演示原型：该模块暂未开放');
    });
  });
}

/* 初始化：读取 URL 角色 */
(function init(){
  const p=new URLSearchParams(location.search);
  const r=p.get('role');
  if(r&&['procurement','legal','admin'].includes(r)){ state.role=r; document.getElementById('roleSel').value=r; }
  renderAll(); applyPerm(); bind();
})();
</script>

<script>
(function(){
  function toggleGroup(p){
    var g=p.closest('.sb-group');
    if(!g) return;
    var willOpen=!g.classList.contains('open');
    document.querySelectorAll('#sbNav .sb-group').forEach(function(x){x.classList.remove('open');});
    if(willOpen) g.classList.add('open');
  }
  document.querySelectorAll('#sbNav .sb-group > .sb-parent').forEach(function(p){
    p.addEventListener('click', function(){ toggleGroup(p); });
  });
  var act=document.querySelector('#sbNav .sb-item.active, #sbNav .sb-sub.active');
  if(act){ var g=act.closest('.sb-group'); if(g) g.classList.add('open'); }
})();
</script>
