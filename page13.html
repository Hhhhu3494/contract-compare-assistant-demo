e:nowrap;overflow:hidden}.sidebar.collapsed .sb-foot{display:none}.sb-toggle{position:absolute;top:64px;left:206px;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;color:var(--ink-3);transition:left .18s}.sidebar.collapsed .sb-toggle{left:50px}.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}.topbar{height:56px;flex:0 0 56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.topbar h1{font-size:16px;margin:0}.topbar .crumb{font-size:12px;color:var(--ink-3);margin-top:2px}.top-right{display:flex;align-items:center;gap:12px}.role-sel{border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:12px;color:var(--ink-1);background:#fff}.content{flex:1;overflow:auto;padding:18px}.lock-note{font-size:12px;color:var(--ink-3)}.stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}.stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 18px;min-width:120px}.stat .n{font-size:22px;font-weight:700}.stat .l{font-size:12px;color:var(--ink-3);margin-top:2px}.stat.add .n{color:var(--risk-low)}.stat.del .n{color:var(--risk-high)}.stat.mod .n{color:var(--risk-mid)}.stat.same .n{color:var(--ink-3)}.sec-title{font-size:14px;font-weight:600;color:var(--ink-1);margin:18px 0 10px;display:flex;align-items:center;gap:8px}.sec-title .line{width:3px;height:14px;background:var(--brand);border-radius:2px}.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:14px}.f-input,.f-select{border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:13px;color:var(--ink-1);background:#fff}.f-input{min-width:220px}.spacer{flex:1}.btn{border:1px solid var(--line);background:#fff;color:var(--ink-1);border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer}.btn:hover{background:var(--bg)}.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn-primary:hover{background:#0e4ad0}.btn-sm{padding:3px 8px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}th{background:#fafbfc;color:var(--ink-3);font-weight:600;font-size:12px}th.th-sort{cursor:pointer;user-select:none}th .si{color:var(--brand);font-size:11px;margin-left:2px}tbody tr{cursor:default;transition:background .12s}tbody tr:hover{background:var(--brand-weak)}.op{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:32px;text-align:center;color:var(--ink-3)}.col-check{width:38px;text-align:center}.sel-info{font-size:12px;color:var(--brand);font-weight:600}.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:260px}.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;line-height:1.5}.t-review{background:var(--review-bg);color:var(--review-text);border:1px solid var(--review-bd)}.t-cat{background:#f2f3f5;color:var(--ink-2)}.t-risk{color:#fff}.t-high{background:var(--risk-high)}.t-mid{background:var(--risk-mid)}.t-low{background:var(--risk-low)}.t-none{background:var(--risk-none)}.t-add{background:var(--c-add);color:var(--ink-1)}.t-del{background:var(--c-del);color:var(--ink-1)}.t-mod{background:var(--c-mod);color:var(--ink-1)}.t-same{background:#f2f3f5;color:var(--ink-2)}.t-active{background:var(--c-add);color:var(--ink-1)}.t-draft{background:#f2f3f5;color:var(--ink-2)}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:920px){.two-col{grid-template-columns:1fr}}.blk{border:1px solid var(--line);border-radius:6px;padding:10px 12px}.blk .bt{font-size:12px;font-weight:600;margin-bottom:8px;color:var(--ink-2);display:flex;align-items:center;gap:6px}.blk .bt .dot{width:8px;height:8px;border-radius:50%}.blk .row{display:flex;gap:8px;font-size:12px;padding:3px 0}.blk .row .k{color:var(--ink-3);min-width:64px;flex:0 0 64px}.blk .row .v{color:var(--ink-1)}.readonly{background:#fafbfc}.op-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.pager{display:flex;gap:6px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}.role-legal .mgr-only,.role-procurement .col-check,.role-procurement .mgr-only{display:none}.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:100}.modal-mask.show{display:flex}.modal-box{position:relative}.modal{background:#fff;border-radius:8px;width:min(760px,94vw);max-height:88vh;overflow:auto;padding:22px}.modal h3{margin:0 0 14px;font-size:16px}.modal-close{position:absolute;top:-14px;right:-14px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:20px;line-height:1;color:var(--ink-3);cursor:pointer;border-radius:6px;z-index:2}.modal-close:hover{background:#f2f3f5;color:var(--ink-1)}.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(29,33,41,.92);color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200}.toast.show{opacity:1}.icon-btn{border:1px solid var(--line);background:#fff;border-radius:4px;width:30px;height:30px;cursor:pointer;color:var(--ink-2);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 30px}.icon-btn:hover{border-color:var(--brand);color:var(--brand)}.topbar{gap:12px}.top-right{margin-left:auto}.sb-children,.sidebar.collapsed .sb-item span,.sidebar.collapsed .sb-sub span{display:none}.sb-group.open .sb-children{display:block}.sb-caret{margin-left:auto;font-size:11px;line-height:1;color:var(--ink-3);transition:transform .15s;transform:rotate(0)}.sb-group.open>.sb-parent .sb-caret{transform:rotate(90deg)}.sb-children .sb-sub{padding-left:32px}.sidebar.collapsed .sb-children{display:none!important}.sidebar.collapsed .sb-caret{display:none}</style>

<body>
<div class="app">
  <!-- 侧边导航（全站统一） -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><div class="logo">C</div><span>合同比对助手</span></div>
          <div class="sb-nav" id="sbNav">
        <div class="sb-group" data-group="ledger">
          <div class="sb-item sb-parent" data-nav="ledger"><span class="ico">▤</span><span>合同台账</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="detail"><span class="ico">›</span><span>合同详情</span></div>
          </div>
        </div>
        <div class="sb-group" data-group="tasks">
          <div class="sb-item sb-parent" data-nav="tasks"><span class="ico">☰</span><span>比对任务管理</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="new"><span class="ico">＋</span><span>新建比对任务</span></div>
            <div class="sb-sub" data-nav="review"><span class="ico">✎</span><span>对比复核页</span></div>
          </div>
        </div>
        <div class="sb-group" data-group="std">
          <div class="sb-item sb-parent" data-nav="std"><span class="ico">📘</span><span>标准条款库</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="clauseDetail"><span class="ico">›</span><span>条款详情&amp;版本对比</span></div>
          </div>
        </div>
        <div class="sb-item" data-nav="risk"><span class="ico">⚠</span><span>风险条款库</span></div>
        <div class="sb-item" data-nav="eval"><span class="ico">📊</span><span>评测集管理</span></div>
        <div class="sb-group" data-group="qc">
          <div class="sb-item sb-parent" data-nav="qc"><span class="ico">✓</span><span>双盲审核工单</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="truthWO" title="复核工单详情"><span class="ico">›</span><span>复核工单详情</span></div>
          </div>
        </div>
        <div class="sb-group" data-group="archive">
          <div class="sb-item sb-parent active" data-nav="archive"><span class="ico">🗄</span><span>复核报告归档</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="reportDetail"><span class="ico">›</span><span>复核报告详情</span></div>
          </div>
        </div>
        <div class="sb-item" data-nav="rule"><span class="ico">⚙</span><span>风控规则配置</span></div>
        <div class="sb-item sb-admin-only" data-nav="setting" style="display:none;"><span class="ico">⚷</span><span>系统权限设置</span></div>
      </div>
  </aside>
  <div class="main">
    <div class="topbar">
        <button class="icon-btn" id="sbToggle" title="收起/展开侧边栏">☰</button>
        <button class="icon-btn" id="backBtn" title="返回上一页" onclick="history.back()">‹</button>
      <div>
        <h1>复核报告归档</h1>
        <div class="crumb">合同比对助手 / 复核报告归档（法务复核完成、闭环归档后只读）</div>
      </div>
      <div class="top-right">
        <span class="lock-note" id="permHint"></span>
        <label class="lock-note">角色</label>
        <select class="role-sel" id="roleSel">
          <option value="procurement">采购专员</option>
          <option value="legal" selected>法务审核员</option>
          <option value="admin">管理员</option>
        </select>
      </div>
    </div>

    <div class="content">
      <!-- 采购只读提示 -->
      <div class="lock-note" id="readOnlyTip" style="display:none;background:#F2F3F5;border-radius:4px;padding:8px 12px;margin-bottom:12px;">采购专员仅可查看归档报告与溯源，导出功能受限。</div>

      <!-- 统计 -->
      <div class="stats" id="stats"></div>

      <!-- 筛选 + 快捷操作 -->
      <div class="filterbar">
        <input class="f-input" id="kw" placeholder="搜索 归档编号 / 合同名称 / 供应商 / 复核人">
        <select class="f-select" id="fMode">
          <option value="">全部比对模式</option>
          <option value="stdSup">标准合同 VS 供应商合同</option>
          <option value="extExt">外部合同 VS 外部合同</option>
          <option value="extStd">外部合同 VS 标准条款</option>
        </select>
        <select class="f-select" id="fRisk">
          <option value="">全部最高风险等级</option>
          <option value="high">高风险</option>
          <option value="mid">中风险</option>
          <option value="low">低风险</option>
          <option value="none">无风险</option>
        </select>
        <select class="f-select" id="fTime">
          <option value="">全部归档时间</option>
          <option value="7">近 7 天</option>
          <option value="30">近 30 天</option>
          <option value="old">30 天前</option>
        </select>
        <select class="f-select" id="fReviewer">
          <option value="">全部复核人</option>
          <option value="法务-王敏">法务-王敏</option>
          <option value="法务-李强">法务-李强</option>
        </select>
        <select class="f-select" id="fType">
          <option value="">全部合同类型</option>
          <option value="采购合同">采购合同</option>
          <option value="服务合同">服务合同</option>
          <option value="框架协议">框架协议</option>
        </select>
        <div class="spacer"></div>
        <button class="btn" id="refreshBtn">刷新</button>
      </div>

      <!-- 归档列表 -->
      <div class="sec-title"><span class="line"></span>复核报告归档列表
        <span class="spacer" style="flex:1;"></span>
        <span class="sel-info" id="selInfo" style="display:none;"></span>
        <button class="btn btn-primary" id="batchExportBtn" disabled>批量导出</button>
        <button class="btn" id="clearSelBtn" style="display:none;">取消选择</button>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th class="col-check"><input type="checkbox" id="checkAll"></th>
              <th class="th-sort" data-sort="id" onclick="setSort('id')">归档编号 <span class="si"></span></th>
              <th>合同名称</th>
              <th>供应商名称</th>
              <th>比对模式</th>
              <th class="th-sort" data-sort="risk" onclick="setSort('risk')">最高风险等级 <span class="si"></span></th>
              <th class="th-sort" data-sort="diff" onclick="setSort('diff')">差异总条数 <span class="si"></span></th>
              <th>复核人</th>
              <th class="th-sort" data-sort="time" onclick="setSort('time')">归档时间 <span class="si"></span></th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="emptyTip" style="display:none;">无匹配的归档报告</div>
        <div class="pager" id="pager"></div>
      </div>
    </div>
  </div>
</div>

<!-- 查看归档报告弹窗 -->
<div class="modal-mask" id="reportMask">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('reportMask')" aria-label="关闭">×</button>
    <div class="modal" id="reportBody"></div>
  </div>
</div>
