<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合同台账 · 合同对比助手</title>
<script src="tailwind.js"></script>
<style>
  :root{
    --brand:#165DFF; --brand-weak:#E8F3FF; --ink-1:#1D2129; --ink-2:#4E5969; --ink-3:#86909C;
    --line:#E5E6EB; --bg:#F7F8FA; --card:#fff;
    --c-add:#B3E8C0; --c-del:#FFBFBF; --c-mod:#FFD9A8;
    --risk-high:#F53F3F; --risk-mid:#D25F00; --risk-low:#00875A; --risk-none:#86909C;
    --review-bg:#E9D5FF; --review-text:#6B21A8; --review-bd:#9333EA;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink-1);background:var(--bg);font-size:13px;}
  .app{display:flex;flex-direction:row;height:100vh;overflow:hidden;}
  /* 侧边导航（全站统一） */
  .sidebar{width:220px;flex:0 0 220px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .18s ease;min-height:0;}
  .sidebar.collapsed{width:64px;flex-basis:64px;}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);height:56px;white-space:nowrap;overflow:hidden;}
  .sidebar.collapsed .sb-brand span{display:none;}
  .logo{width:30px;height:30px;border-radius:6px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 30px;}
  .sb-nav{flex:1;overflow:auto;padding:8px;min-height:0;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--ink-2);cursor:pointer;margin-bottom:2px;white-space:nowrap;overflow:hidden;}
  .sb-item:hover{background:var(--bg);}
  .sb-item.active{background:var(--brand-weak);color:var(--brand);font-weight:600;}
  .sb-sub{padding-left:34px;font-size:13px;color:var(--ink-3);}
  .sb-sub .ico{opacity:.5;}
  .sb-sub:hover{background:var(--bg);}
  .sb-sub.active{background:var(--brand-weak);color:var(--brand);font-weight:600;}
  .sidebar.collapsed .sb-sub span{display:none;}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink-2);}
  .sb-item .ico{width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;}
  .sidebar.collapsed .sb-item span{display:none;}
  .sb-foot{padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);line-height:1.7;white-space:nowrap;overflow:hidden;}
  .sidebar.collapsed .sb-foot{display:none;}
  .sb-toggle{position:absolute;top:64px;left:206px;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;color:var(--ink-3);transition:left .18s ease;}
  .sidebar.collapsed .sb-toggle{left:50px;}
  /* 主区 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
  .topbar{height:56px;flex:0 0 56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;}
  .topbar h1{font-size:16px;margin:0;}
  .topbar .crumb{font-size:12px;color:var(--ink-3);margin-top:2px;}
  .top-right{display:flex;align-items:center;gap:12px;}
  .role-sel{border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:12px;color:var(--ink-1);background:#fff;}
  .content{flex:1;overflow:auto;padding:18px;}
  /* 筛选条 */
  .filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:14px;}
  .f-input,.f-select{border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:13px;color:var(--ink-1);background:#fff;}
  .f-input{min-width:220px;}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer;}
  .spacer{flex:1;}
  /* 统计卡 */
  .stats{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 16px;min-width:130px;}
  .stat .n{font-size:22px;font-weight:700;}
  .stat .l{font-size:12px;color:var(--ink-3);margin-top:2px;}
  .stat.review .n{color:var(--review-text);}
  /* 表格 */
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
  th{background:#FAFBFC;color:var(--ink-3);font-weight:600;font-size:12px;}
  th[data-sort]{cursor:pointer;user-select:none;}
  th[data-sort]:hover{color:var(--brand);}
  .sort-ico{font-size:10px;margin-left:2px;color:var(--brand);}
  tbody tr{cursor:default;transition:background .12s;}
  tbody tr:hover{background:var(--brand-weak);}
  .tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;line-height:1.5;}
  .st-draft{background:#FFF7E8;color:var(--risk-mid);}
  .st-active{background:#E8FFEA;color:var(--risk-low);}
  .st-reviewing{background:var(--brand-weak);color:var(--brand);}
  .st-arch{background:#F2F3F5;color:var(--ink-3);}
  .t-type{background:#F2F3F5;color:var(--ink-2);}
  .t-review{background:var(--review-bg);color:var(--review-text);border:1px solid var(--review-bd);}
  .op{display:flex;gap:6px;flex-wrap:wrap;}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink-1);border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer;}
  .btn:hover{background:var(--bg);}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn-primary:hover{background:#0E4AD0;}
  .btn-sm{padding:3px 8px;font-size:12px;}
  .empty{padding:40px;text-align:center;color:var(--ink-3);}
  .batch-bar{display:none;align-items:center;gap:10px;background:#F2F3F5;border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:13px;color:var(--ink-1);}
  .batch-bar.show{display:flex;}
  .btn-primary.is-disabled{background:#C9CDD4;border-color:#C9CDD4;color:#fff;cursor:not-allowed;}
  .btn-primary.is-disabled:hover{background:#C9CDD4;border-color:#C9CDD4;}
  /* 角色：采购隐藏批量列与批量按钮、版本记录 */
  .role-procurement .batch-col{display:none;}
  .role-procurement .batch-btn{display:none;}
  .role-procurement .op-version{display:none;}
  /* 弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:100;}
  .modal-mask.show{display:flex;}
  .modal-box{position:relative;}
  .modal{background:#fff;border-radius:8px;width:min(440px,92vw);max-height:86vh;overflow:auto;padding:22px;}
  .modal h3{margin:0 0 14px;font-size:16px;}
  .modal-close{position:absolute;top:-14px;right:-14px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:20px;line-height:1;color:var(--ink-3);cursor:pointer;border-radius:6px;z-index:2;}
  .modal-close:hover{background:#F2F3F5;color:var(--ink-1);}
  .toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(29,33,41,.92);color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;}
  .toast.show{opacity:1;}
  .lock-note{font-size:12px;color:var(--ink-3);}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:4px;width:30px;height:30px;cursor:pointer;color:var(--ink-2);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 30px;}
.icon-btn:hover{border-color:var(--brand);color:var(--brand);}
.topbar{gap:12px;}
.top-right{margin-left:auto;}
.sidebar.collapsed .sb-item span,.sidebar.collapsed .sb-sub span{display:none;}

  /* 二级菜单手风琴 */
  .sb-children{display:none;}
  .sb-group.open .sb-children{display:block;}
  .sb-caret{margin-left:auto;font-size:11px;line-height:1;color:var(--ink-3);transition:transform .15s;transform:rotate(0deg);}
  .sb-group.open > .sb-parent .sb-caret{transform:rotate(90deg);}
  .sb-children .sb-sub{padding-left:32px;}
  .sidebar.collapsed .sb-children{display:none!important;}
  .sidebar.collapsed .sb-caret{display:none;}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边导航（全站统一） -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><div class="logo">C</div><span>合同对比助手</span></div>
          <div class="sb-nav" id="sbNav">
        <div class="sb-group" data-group="ledger">
          <div class="sb-item sb-parent active" data-nav="ledger"><span class="ico">▤</span><span>合同台账</span><span class="sb-caret">▸</span></div>

</div>

<script>
const NAV = {
  ledger:{page:true},
  tasks:{url:'page3.html'},
  new:{url:'page4.html'},
  std:{url:'page6.html'}, risk:{url:'page9.html'}, eval:{url:'page10.html'}, qc:{url:'page11.html'}, truthWO:{url:'page14.html'}, rule:{url:'page12.html'}, archive:{url:'page13.html'},
  detail:{url:'page2.html'},
  review:{url:'page5.html'},
  clauseDetail:{url:'page7.html'},
  reportDetail:{url:'page8.html'},
 setting:{}
};
const ROLE_LABEL = {procurement:'采购专员（仅查看自建合同）', legal:'法务审核员（全量查看）', admin:'管理员（全权限）'};

const CONTRACTS = [
  {id:'C-001', name:'华东精密年度采购主协议', code:'HT-2026-001837', party:'华东精密制造', type:'采购主协议', status:'active', owner:'legal', review:3, time:'2026-11-03 09:12'},
  {id:'C-002', name:'电机产线设备采购合同', code:'HT-2026-001902', party:'力神装备', type:'设备采购', status:'draft', owner:'procurement', review:1, time:'2026-11-02 14:40'},
  {id:'C-003', name:'汽车冲压件框架协议V3', code:'HT-2026-001845', party:'明锐金属', type:'框架协议', status:'reviewing', owner:'legal', review:0, time:'2026-10-30 11:05'},
  {id:'C-004', name:'化工原料供应合同', code:'HT-2026-001910', party:'恒丰化工', type:'供应合同', status:'active', owner:'legal', review:2, time:'2026-10-29 16:20'},
  {id:'C-005', name:'外部咨询服务合同', code:'HT-2026-001933', party:'智远咨询', type:'服务合同', status:'arch', owner:'procurement', review:0, time:'2026-10-28 10:02'},
  {id:'C-006', name:'包装材料采购合同V2', code:'HT-2026-001955', party:'绿源包装', type:'供应合同', status:'arch', owner:'admin', review:1, time:'2026-10-25 09:48'},
  {id:'C-007', name:'轴承标准采购合同', code:'HT-2026-001978', party:'精工轴承', type:'采购主协议', status:'reviewing', owner:'legal', review:2, time:'2026-10-24 15:33'},
  {id:'C-008', name:'IT运维外部服务合同', code:'HT-2026-002001', party:'云鼎科技', type:'服务合同', status:'draft', owner:'procurement', review:2, time:'2026-10-22 13:10'},
  {id:'C-009', name:'注塑模具设备采购合同', code:'HT-2026-002018', party:'锐驰模具', type:'设备采购', status:'active', owner:'legal', review:0, time:'2026-10-20 08:55'},
  {id:'C-010', name:'钢材框架供应协议', code:'HT-2026-002030', party:'联众钢铁', type:'框架协议', status:'active', owner:'legal', review:4, time:'2026-10-18 17:20'}
];

const ST_LABEL = {draft:'草稿', active:'生效中', reviewing:'复核中', arch:'已归档'};
const ST_CLASS = {draft:'st-draft', active:'st-active', reviewing:'st-reviewing', arch:'st-arch'};

const state = { role:'legal', selected:new Set(), sortKey:'time', sortDir:'desc' };

/* 跨页导航：把相对文件名解析成基于当前页面的绝对地址，避免预览容器 / 子路径部署时
   相对路径解析失败导致目标页加载不出来；role 走 searchParams，保证始终在 #hash 之前；
   400ms 内的重复触发只导航一次（父项同时绑定手风琴，防止一次点击两次赋值）。 */
let _lastNavAt = 0;
function go(url){
  const now = Date.now();
  if(now - _lastNavAt < 400) return;
  _lastNavAt = now;
  try{
    const u = new URL(url, window.location.href);
    if(!u.searchParams.has('role')) u.searchParams.set('role', state.role);
    window.location.assign(u.href);
  }catch(e){
    const sep = url.indexOf('?')>-1 ? '&' : '?';
    window.location.href = url + (/[?&]role=/.test(url) ? '' : sep + 'role=' + state.role);
  }
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
function showModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

function filtered(){
  const kw=document.getElementById('kw').value.trim().toLowerCase();
  const ft=document.getElementById('fType').value;
  const fs=document.getElementById('fStatus').value;
  const fr=document.getElementById('fReview').checked;
  const list = CONTRACTS.filter(c=>{
    if(state.role==='procurement' && c.owner!=='procurement') return false;
    if(kw && !(c.name.toLowerCase().includes(kw)||c.code.toLowerCase().includes(kw)||c.party.toLowerCase().includes(kw))) return false;
    if(ft && c.type!==ft) return false;
    if(fs && c.status!==fs) return false;
    if(fr && c.review===0) return false;
    return true;
  });
  if(state.sortKey==='time'){
    list.sort((a,b)=> state.sortDir==='asc' ? a.time.localeCompare(b.time) : b.time.localeCompare(a.time));
  }
  return list;
}

function toggleSort(key){
  if(state.sortKey===key){ state.sortDir = state.sortDir==='asc'?'desc':'asc'; }
  else { state.sortKey=key; state.sortDir='desc'; }
  updateSortInd();
  renderTable();
}
function updateSortInd(){
  const ind=document.getElementById('timeInd');
  ind.textContent = (state.sortKey==='time') ? (state.sortDir==='asc'?'▲':'▼') : '';
}

function renderStats(list){
  const total=list.length;
  const active=list.filter(c=>c.status==='active').length;
  const reviewing=list.filter(c=>c.status==='reviewing').length;
  const reviewSum=list.reduce((s,c)=>s+c.review,0);
  document.getElementById('stats').innerHTML =
    stat(total,'合同总数')+stat(active,'生效中')+stat(reviewing,'复核中')+
    '<div class="stat review">'+big(reviewSum)+'<div class="l">待重点复核条目</div></div>';
}
function stat(n,l){ return '<div class="stat">'+big(n)+'<div class="l">'+l+'</div></div>'; }
function big(n){ return '<div class="n">'+n+'</div>'; }

function renderTable(){
  updateSortInd();
  const list=filtered();
  renderStats(list);
  const tb=document.getElementById('tbody');
  if(!list.length){ tb.innerHTML='<tr><td colspan="9" class="empty">无匹配合同</td></tr>'; updateBatchBar(); return; }
  tb.innerHTML=list.map(c=>{
    const checked=state.selected.has(c.id)?'checked':'';
    return '<tr>'+
      '<td class="batch-col"><input type="checkbox" class="row-sel" data-id="'+c.id+'" '+checked+'></td>'+
      '<td><a href="javascript:void(0)" onclick="openDetail(\''+c.id+'\')" style="color:var(--brand);font-weight:600;">'+c.name+'</a></td>'+
      '<td class="code">'+c.code+'</td>'+
      '<td>'+c.party+'</td>'+
      '<td><span class="tag t-type">'+c.type+'</span></td>'+
      '<td><span class="tag '+ST_CLASS[c.status]+'">'+ST_LABEL[c.status]+'</span></td>'+
      '<td>'+(c.review>0?'<span class="tag t-review">'+c.review+' 条</span>':'<span style="color:var(--ink-3);">—</span>')+'</td>'+
      '<td class="code">'+c.time+'</td>'+
      '<td><div class="op">'+
        '<button class="btn btn-sm" onclick="openDetail(\''+c.id+'\')">查看详情</button>'+
        '<button class="btn btn-sm btn-primary" onclick="startCompare(\''+c.id+'\')">发起比对</button>'+
        '<button class="btn btn-sm op-version" onclick="openVersion(\''+c.id+'\')">版本记录</button>'+
      '</div></td>'+
    '</tr>';
  }).join('');
  bindRowSel();
  updateBatchBar();
}

function openDetail(id){ go('page2.html'); }
function openVersion(id){
  if(state.role==='procurement'){ toast('采购专员无版本管理权限'); return; }
  toast('打开合同 '+id+' 版本记录（演示）');
}
function startCompare(id){
  const c=CONTRACTS.find(x=>x.id===id);
  if(!c){ toast('合同不存在'); return; }
  const p='srcId='+encodeURIComponent(c.id)+'&srcName='+encodeURIComponent(c.name)+'&srcCode='+encodeURIComponent(c.code)+'&srcType='+encodeURIComponent(c.type);
  go('page4.html?'+p);
}

/* 批量选择 */
function bindRowSel(){
  document.querySelectorAll('.row-sel').forEach(cb=>{
    cb.addEventListener('change',()=>{
      const id=cb.dataset.id;
      if(cb.checked) state.selected.add(id); else state.selected.delete(id);
      updateBatchBar(); syncSelAll();
    });
  });
}
function syncSelAll(){
  const all=document.querySelectorAll('.row-sel');
  const sel=document.querySelectorAll('.row-sel:checked');
  document.getElementById('selAll').checked = all.length>0 && all.length===sel.length;
}
document.getElementById('selAll').addEventListener('change',e=>{
  document.querySelectorAll('.row-sel').forEach(cb=>{
    cb.checked=e.target.checked;
    if(cb.checked) state.selected.add(cb.dataset.id); else state.selected.delete(cb.dataset.id);
  });
  updateBatchBar();
});
function updateBatchBar(){
  const n=state.selected.size;
  document.getElementById('batchInfo').textContent='已选 '+n+' 份';
  document.getElementById('batchBar').classList.toggle('show', n>0);
  const btn=document.getElementById('batchBtn');
  const off = n===0;
  btn.classList.toggle('is-disabled', off);
  btn.title = off ? '请先在下方表格勾选需要比对的合同' : '';
}
function closeBatchBar(){ document.getElementById('batchBar').classList.remove('show'); }
function clearSel(){ state.selected.clear(); renderTable(); }
function doBatch(){
  const n=state.selected.size;
  if(n===0) return;
  if(n>2){ toast('最多只能上传两个合同，请重新选择。'); return; }
  // 选中 ≤2 份：跳转到新建比对页，并自动带入所选的两个合同
  const ids=[...state.selected];
  const c1=CONTRACTS.find(c=>c.id===ids[0]);
  const c2=ids[1]?CONTRACTS.find(c=>c.id===ids[1]):null;
  let p='c1='+encodeURIComponent(c1.id)+'&cn1='+encodeURIComponent(c1.name)+'&cc1='+encodeURIComponent(c1.code);
  if(c2) p+='&c2='+encodeURIComponent(c2.id)+'&cn2='+encodeURIComponent(c2.name)+'&cc2='+encodeURIComponent(c2.code);
  go('page4.html?'+p);
}

/* 权限 */
function applyPerm(){
  document.body.classList.toggle('role-procurement', state.role==='procurement');
  document.getElementById('permHint').textContent=ROLE_LABEL[state.role];
  // 管理员可见系统权限设置
  document.querySelectorAll('.sb-admin-only').forEach(el=>{ el.style.display = state.role==='admin'?'flex':'none'; });
  renderTable();
}

/* 导航 */
document.querySelectorAll('.sb-item[data-nav], .sb-sub[data-nav]').forEach(el=>{
  el.addEventListener('click',()=>{
    const nav=el.dataset.nav; const cfg=NAV[nav];
    if(cfg&&cfg.page) return;
    if(cfg&&cfg.url){ go(cfg.url); return; }
    toast('「'+(el.querySelector('span:last-child')?el.querySelector('span:last-child').textContent:'')+'」模块演示中');
  });
});
document.getElementById('sbToggle').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.toggle('collapsed');
});
document.getElementById('roleSel').addEventListener('change',e=>{ state.role=e.target.value; applyPerm(); });
document.getElementById('uploadBtn').addEventListener('click',()=>toast('打开上传回稿（演示）'));
document.getElementById('batchBtn').addEventListener('click',()=>{
  if(state.role==='procurement'){ toast('采购专员无批量比对权限'); return; }
  if(state.selected.size===0) return; // 未勾选：置灰态，静默不触发、不弹 toast
  doBatch();
});

/* 筛选 */
['kw','fType','fStatus','fReview'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>renderTable());
  document.getElementById(id).addEventListener('change',()=>renderTable());
});
document.getElementById('thTime').addEventListener('click',()=>toggleSort('time'));

/* 初始化：读取 URL 角色，保持跨页一致 */
(function init(){
  const p=new URLSearchParams(location.search);
  const r=p.get('role');
  if(r&&['procurement','legal','admin'].includes(r)){ state.role=r; document.getElementById('roleSel').value=r; }
  applyPerm();
})();
</script>

<script>
(function(){
  function toggleGroup(p){
    var g=p.closest('.sb-group');
    if(!g) return;
    var willOpen=!g.classList.contains('open');
    document.querySelectorAll('#sbNav .sb-group').forEach(function(x){x.classList.remove('open');});
    if(willOpen) g.classList.add('open');
  }
  document.querySelectorAll('#sbNav .sb-group > .sb-parent').forEach(function(p){
    p.addEventListener('click', function(){ toggleGroup(p); });
  });
  // 初始：仅展开含 active 项的组（其余折叠，满足手风琴默认折叠）
  var act=document.querySelector('#sbNav .sb-item.active, #sbNav .sb-sub.active');
  if(act){ var g=act.closest('.sb-group'); if(g) g.classList.add('open'); }
})();
</script>
</body>
</html>
