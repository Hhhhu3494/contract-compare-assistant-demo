<div class="app">
  <!-- 侧边导航（全站统一） -->
    <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><div class="logo">C</div><span>合同比对助手</span></div>
          <div class="sb-nav" id="sbNav">
        <div class="sb-group" data-group="ledger">
          <div class="sb-item sb-parent" data-nav="ledger"><span class="ico">▤</span><span>合同台账</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="detail"><span class="ico">›</span><span>合同详情</span></div>
          </div>
        </div>
        <div class="sb-group" data-group="tasks">
          <div class="sb-item sb-parent active" data-nav="tasks"><span class="ico">☰</span><span>比对任务管理</span><span class="sb-caret">▸</span></div>

            <div class="sb-sub" data-nav="new"><span class="ico">＋</span><span>新建比对任务</span></div>
            <div class="sb-sub" data-nav="review"><span class="ico">✎</span><span>对比复核页</span></div>
          </div>
        </div>
        <div class="sb-group" data-group="std">
          <div class="sb-item sb-parent" data-nav="std"><span class="ico">📘</span><span>标准条款库</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="clauseDetail"><span class="ico">›</span><span>条款详情&amp;版本对比</span></div>
          </div>
        </div>
        <div class="sb-item" data-nav="risk"><span class="ico">⚠</span><span>风险条款库</span></div>
        <div class="sb-item" data-nav="eval"><span class="ico">📊</span><span>评测集管理</span></div>
        <div class="sb-group" data-group="qc">
          <div class="sb-item sb-parent" data-nav="qc"><span class="ico">✓</span><span>双盲审核工单</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="truthWO" title="复核工单详情"><span class="ico">›</span><span>复核工单详情</span></div>
          </div>
        </div>
        <div class="sb-group" data-group="archive">
          <div class="sb-item sb-parent" data-nav="archive"><span class="ico">🗄</span><span>复核报告归档</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="reportDetail"><span class="ico">›</span><span>复核报告详情</span></div>
          </div>
        </div>
        <div class="sb-item" data-nav="rule"><span class="ico">⚙</span><span>风控规则配置</span></div>
        <div class="sb-item sb-admin-only" data-nav="setting" style="display:none;"><span class="ico">⚷</span><span>系统权限设置</span></div>

  </aside>
  <div class="main">
    <div class="topbar">

        <button class="icon-btn" id="backBtn" title="返回上一页" onclick="history.back()">‹</button>
      <div>
        <h1>比对任务列表</h1>
        <div class="crumb">合同比对助手 / 法务工作台 / 比对任务</div>
      </div>
      <div class="top-right">
        <span class="lock-note" id="permHint"></span>
        <label class="lock-note">角色</label>
        <select class="role-sel" id="roleSel">
          <option value="procurement">采购专员</option>
          <option value="legal" selected>法务审核员</option>
          <option value="admin">管理员</option>
        </select>
      </div>
    </div>

    <div class="content">
      <!-- 统计 -->
      <div class="stats">
        <div class="stat"><div class="n" id="stTotal">0</div><div class="l">任务总数</div></div>
        <div class="stat"><div class="n" id="stWait">0</div><div class="l">待复核</div></div>
        <div class="stat review"><div class="n" id="stReview">0</div><div class="l">待重点复核条目</div></div>
      </div>

      <!-- 筛选条 -->
      <div class="filterbar">
        <input class="f-input" id="searchInput" placeholder="搜索任务名 / 合同 / 供应商">
        <select class="f-select" id="typeSel">
          <option value="all">全部类型</option>
          <option value="std-vs-sup">标准合同 VS 供应商合同</option>
          <option value="ext-vs-std">外部合同 VS 标准条款</option>
          <option value="ver-compare">历史版本对比</option>
        </select>
        <select class="f-select" id="statusSel">
          <option value="all">全部状态</option>
          <option value="wait">待复核</option>
          <option value="doing">复核中</option>
          <option value="done">已完成</option>
          <option value="arch">已归档</option>
        </select>
        <label class="chk"><input type="checkbox" id="onlyReview">仅看待重点复核</label>
        <button class="btn-primary btn" id="newBtn" style="margin-left:auto;">＋ 新建比对</button>
      </div>

      <!-- 表格 -->
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>任务名</th><th>合同</th><th>合同编号</th><th>供应商</th><th>类型</th>
              <th>状态</th><th>待重点复核</th><th data-sort="time" id="thTime">时间<span class="sort-ico" id="timeInd"></span></th><th>操作</th>
            </tr>
          </thead>
          <tbody id="taskBody"></tbody>
        </table>
        <div class="empty" id="emptyTip" style="display:none;">无匹配任务</div>
      </div>
    </div>
  </div>
</div>

<!-- 归档确认弹窗 -->
<div class="modal-mask" id="archMask">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('archMask')" aria-label="关闭">×</button>
    <div class="modal">
      <h3>强制归档确认</h3>
      <p style="color:var(--ink-2);line-height:1.7;margin:0 0 18px;">确认将该任务强制归档？归档后复核记录将固化，仅管理员可修改归档记录。</p>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn" onclick="closeModal('archMask')">否</button>
        <button class="btn-primary btn" onclick="doArchive()">是</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
