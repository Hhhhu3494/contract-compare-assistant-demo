<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>比对任务列表 · 合同对比助手</title>
<script src="tailwind.js"></script>
<style>
  :root{
    --brand:#165DFF; --brand-weak:#E8F3FF; --ink-1:#1D2129; --ink-2:#4E5969; --ink-3:#86909C;
    --line:#E5E6EB; --bg:#F7F8FA; --card:#fff;
    --c-add:#B3E8C0; --c-del:#FFBFBF; --c-mod:#FFD9A8;
    --risk-high:#F53F3F; --risk-mid:#D25F00; --risk-low:#00875A; --risk-none:#86909C;
    --review-bg:#E9D5FF; --review-text:#6B21A8; --review-bd:#9333EA;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink-1);background:var(--bg);font-size:13px;}
  .app{display:flex;flex-direction:row;height:100vh;overflow:hidden;}
  /* 侧边导航（全站统一） */
  .sidebar{width:220px;flex:0 0 220px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .18s ease;min-height:0;}
  .sidebar.collapsed{width:64px;flex-basis:64px;}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);height:56px;white-space:nowrap;overflow:hidden;}
  .sidebar.collapsed .sb-brand span{display:none;}
  .logo{width:30px;height:30px;border-radius:6px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 30px;}
  .sb-nav{flex:1;overflow:auto;padding:8px;min-height:0;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--ink-2);cursor:pointer;margin-bottom:2px;white-space:nowrap;overflow:hidden;}
  .sb-item:hover{background:var(--bg);}
  .sb-item.active{background:var(--brand-weak);color:var(--brand);font-weight:600;}
  .sb-sub{padding-left:34px;font-size:13px;color:var(--ink-3);}
  .sb-sub .ico{opacity:.5;}
  .sb-sub:hover{background:var(--bg);}
  .sb-sub.active{background:var(--brand-weak);color:var(--brand);border-left-color:var(--brand);font-weight:600;}
  .sidebar.collapsed .sb-sub span{display:none;}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink-2);}
  .sb-item .ico{width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;}
  .sidebar.collapsed .sb-item span{display:none;}
  .sb-foot{padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);line-height:1.7;white-space:nowrap;overflow:hidden;}
  .sidebar.collapsed .sb-foot{display:none;}
  .sb-toggle{position:absolute;top:64px;left:206px;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;color:var(--ink-3);transition:left .18s ease;}
  .sidebar.collapsed .sb-toggle{left:50px;}
  /* 主区 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
  .topbar{height:56px;flex:0 0 56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;}
  .topbar h1{font-size:16px;margin:0;}
  .topbar .crumb{font-size:12px;color:var(--ink-3);margin-top:2px;}
  .top-right{display:flex;align-items:center;gap:12px;}
  .role-sel{border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:12px;color:var(--ink-1);background:#fff;}
  .content{flex:1;overflow:auto;padding:18px;}
  /* 筛选条 */
  .filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:14px;}
  .f-input,.f-select{border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:13px;color:var(--ink-1);background:#fff;}
  .f-input{min-width:220px;}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer;}
  /* 统计卡 */
  .stats{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 16px;min-width:130px;}
  .stat .n{font-size:22px;font-weight:700;}
  .stat .l{font-size:12px;color:var(--ink-3);margin-top:2px;}
  .stat.review .n{color:var(--review-text);}
  /* 表格 */
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
  th{background:#FAFBFC;color:var(--ink-3);font-weight:600;font-size:12px;}
  th[data-sort]{cursor:pointer;user-select:none;}
  th[data-sort]:hover{color:var(--brand);}
  .sort-ico{font-size:10px;margin-left:2px;color:var(--brand);}
  tbody tr{cursor:default;transition:background .12s;}
  tbody tr:hover{background:var(--brand-weak);}
  .tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;line-height:1.5;}
  .st-wait{background:#FFF7E8;color:var(--risk-mid);}
  .st-doing{background:var(--brand-weak);color:var(--brand);}
  .st-done{background:#E8FFEA;color:var(--risk-low);}
  .st-arch{background:#F2F3F5;color:var(--ink-3);}
  .t-type{background:#F2F3F5;color:var(--ink-2);}
  .t-review{background:var(--review-bg);color:var(--review-text);border:1px solid var(--review-bd);}
  .op{display:flex;gap:6px;flex-wrap:wrap;}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink-1);border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer;}
  .btn:hover{background:var(--bg);}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn-primary:hover{background:#0E4AD0;}
  .btn-sm{padding:3px 8px;font-size:12px;}
  .empty{padding:40px;text-align:center;color:var(--ink-3);}
  /* 弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:100;}
  .modal-mask.show{display:flex;}
  .modal-box{position:relative;}
  .modal{background:#fff;border-radius:8px;width:min(440px,92vw);max-height:86vh;overflow:auto;padding:22px;}
  .modal h3{margin:0 0 14px;font-size:16px;}
  .modal-close{position:absolute;top:-14px;right:-14px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:20px;line-height:1;color:var(--ink-3);cursor:pointer;border-radius:6px;z-index:2;}
  .modal-close:hover{background:#F2F3F5;color:var(--ink-1);}
  .toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(29,33,41,.92);color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;}
  .toast.show{opacity:1;}
  .lock-note{font-size:12px;color:var(--ink-3);}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:4px;width:30px;height:30px;cursor:pointer;color:var(--ink-2);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 30px;}
.icon-btn:hover{border-color:var(--brand);color:var(--brand);}
.topbar{gap:12px;}
.top-right{margin-left:auto;}
.sidebar.collapsed .sb-item span,.sidebar.collapsed .sb-sub span{display:none;}

  /* 二级菜单手风琴 */
  .sb-children{display:none;}
  .sb-group.open .sb-children{display:block;}
  .sb-caret{margin-left:auto;font-size:11px;line-height:1;color:var(--ink-3);transition:transform .15s;transform:rotate(0deg);}
  .sb-group.open > .sb-parent .sb-caret{transform:rotate(90deg);}
  .sb-children .sb-sub{padding-left:32px;}
  .sidebar.collapsed .sb-children{display:none!important;}
  .sidebar.collapsed .sb-caret{display:none;}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边导航（全站统一） -->
    <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><div class="logo">C</div><span>合同对比助手</span></div>
          <div class="sb-nav" id="sbNav">
        <div class="sb-group" data-group="ledger">
          <div class="sb-item sb-parent" data-nav="ledger"><span class="ico">▤</span><span>合同台账</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="detail"><span class="ico">›</span><span>合同详情</span></div>
          </div>
        </div>
        <div class="sb-group" data-group="tasks">
          <div class="sb-item sb-parent active" data-nav="tasks"><span class="ico">☰</span><span>比对任务管理</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="new"><span class="ico">＋</span><span>新建比对任务</span></div>
            <div class="sb-sub" data-nav="review"><span class="ico">✎</span><span>对比复核页</span></div>
          </div>
        </div>
        <div class="sb-group" data-group="std">
          <div class="sb-item sb-parent" data-nav="std"><span class="ico">📘</span><span>标准条款库</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="clauseDetail"><span class="ico">›</span><span>条款详情&amp;版本对比</span></div>
          </div>
        </div>
        <div class="sb-item" data-nav="risk"><span class="ico">⚠</span><span>风险条款库</span></div>
        <div class="sb-item" data-nav="eval"><span class="ico">📊</span><span>评测集管理</span></div>
        <div class="sb-group" data-group="qc">
          <div class="sb-item sb-parent" data-nav="qc"><span class="ico">✓</span><span>双盲审核工单</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="truthWO" title="双盲真值复核工单详情页"><span class="ico">›</span><span>双盲真值复核详情</span></div>
          </div>
        </div>
        <div class="sb-item" data-nav="rule"><span class="ico">⚙</span><span>风控规则配置</span></div>
        <div class="sb-group" data-group="archive">
          <div class="sb-item sb-parent" data-nav="archive"><span class="ico">🗄</span><span>复核报告归档</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="reportDetail"><span class="ico">›</span><span>复核报告详情</span></div>
          </div>
        </div>
        <div class="sb-item sb-admin-only" data-nav="setting" style="display:none;"><span class="ico">⚷</span><span>系统权限设置</span></div>
      </div>
    <div class="sb-foot">一期 规则引擎+差异模型<br>二期 样本相似度+难例挖掘<br>无大模型自动解读</div>
  </aside>
  <div class="main">
    <div class="topbar">
        <button class="icon-btn" id="sbToggle" title="收起/展开侧边栏">☰</button>
        <button class="icon-btn" id="backBtn" title="返回上一页" onclick="history.back()">‹</button>
      <div>
        <h1>比对任务列表</h1>
        <div class="crumb">合同对比助手 / 法务工作台 / 比对任务</div>
      </div>
      <div class="top-right">
        <span class="lock-note" id="permHint"></span>
        <label class="lock-note">角色</label>
        <select class="role-sel" id="roleSel">
          <option value="procurement">采购专员</option>
          <option value="legal" selected>法务审核员</option>
          <option value="admin">管理员</option>
        </select>
      </div>
    </div>

    <div class="content">
      <!-- 统计 -->
      <div class="stats">
        <div class="stat"><div class="n" id="stTotal">0</div><div class="l">任务总数</div></div>
        <div class="stat"><div class="n" id="stWait">0</div><div class="l">待复核</div></div>
        <div class="stat review"><div class="n" id="stReview">0</div><div class="l">待重点复核条目</div></div>
      </div>

      <!-- 筛选条 -->
      <div class="filterbar">
        <input class="f-input" id="searchInput" placeholder="搜索任务名 / 合同 / 供应商">
        <select class="f-select" id="typeSel">
          <option value="all">全部类型</option>
          <option value="std-vs-sup">标准合同 VS 供应商合同</option>
          <option value="ext-vs-std">外部合同 VS 标准条款</option>
          <option value="ver-compare">历史版本对比</option>
        </select>
        <select class="f-select" id="statusSel">
          <option value="all">全部状态</option>
          <option value="wait">待复核</option>
          <option value="doing">复核中</option>
          <option value="done">已完成</option>
          <option value="arch">已归档</option>
        </select>
        <label class="chk"><input type="checkbox" id="onlyReview">仅看待重点复核</label>
        <button class="btn-primary btn" id="newBtn" style="margin-left:auto;">＋ 新建比对</button>
      </div>

      <!-- 表格 -->
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>任务名</th><th>合同</th><th>合同编号</th><th>供应商</th><th>类型</th>
              <th>状态</th><th>待重点复核</th><th data-sort="time" id="thTime">时间<span class="sort-ico" id="timeInd"></span></th><th>操作</th>
            </tr>
          </thead>
          <tbody id="taskBody"></tbody>
        </table>
        <div class="empty" id="emptyTip" style="display:none;">无匹配任务</div>
      </div>
    </div>
  </div>
</div>

<!-- 归档确认弹窗 -->
<div class="modal-mask" id="archMask">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('archMask')" aria-label="关闭">×</button>
    <div class="modal">
      <h3>强制归档确认</h3>
      <p style="color:var(--ink-2);line-height:1.7;margin:0 0 18px;">确认将该任务强制归档？归档后复核记录将固化，仅管理员可修改归档记录。</p>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn" onclick="closeModal('archMask')">否</button>
        <button class="btn-primary btn" onclick="doArchive()">是</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 数据：比对任务（演示） ============ */
const TASKS = [
  {id:'T-2026-0831', code:'HT-2026-0831', name:'华东精密年度采购合同比对', contract:'华东精密-年度采购主协议', supplier:'华东精密制造', type:'std-vs-sup', status:'wait', time:'2026-11-03 09:12', owner:'legal', review:3, diffs:9},
  {id:'T-2026-0830', code:'HT-2026-0830', name:'电机产线设备采购条款审查', contract:'电机产线-设备采购合同', supplier:'力神装备', type:'ext-vs-std', status:'doing', time:'2026-11-02 14:40', owner:'procurement', review:1, diffs:6},
  {id:'T-2026-0829', code:'HT-2026-0829', name:'汽车冲压件框架协议复核', contract:'汽车冲压件-框架协议V3', supplier:'明锐金属', type:'ver-compare', status:'done', time:'2026-10-30 11:05', owner:'legal', review:0, diffs:12},
  {id:'T-2026-0828', code:'HT-2026-0828', name:'化工原料供应合同比对', contract:'化工原料-供应合同', supplier:'恒丰化工', type:'std-vs-sup', status:'wait', time:'2026-10-29 16:20', owner:'legal', review:2, diffs:7},
  {id:'T-2026-0827', code:'HT-2026-0827', name:'外部咨询合同标准条款核查', contract:'外部咨询-服务合同', supplier:'智远咨询', type:'ext-vs-std', status:'done', time:'2026-10-28 10:02', owner:'procurement', review:0, diffs:4},
  {id:'T-2026-0826', code:'HT-2026-0826', name:'包装材料历史版本差异分析', contract:'包装材料-采购合同V2', supplier:'绿源包装', type:'ver-compare', status:'arch', time:'2026-10-25 09:48', owner:'admin', review:1, diffs:5},
  {id:'T-2026-0825', code:'HT-2026-0825', name:'轴承采购标准合同比对', contract:'轴承-标准采购合同', supplier:'精工轴承', type:'std-vs-sup', status:'doing', time:'2026-10-24 15:33', owner:'legal', review:0, diffs:8},
  {id:'T-2026-0824', code:'HT-2026-0824', name:'IT运维外部合同核查', contract:'IT运维-服务合同', supplier:'云鼎科技', type:'ext-vs-std', status:'wait', time:'2026-10-22 13:10', owner:'procurement', review:2, diffs:6}
];
const TYPE_LABEL={ 'std-vs-sup':'标准合同 VS 供应商合同', 'ext-vs-std':'外部合同 VS 标准条款', 'ver-compare':'历史版本对比' };
const STATUS_LABEL={ wait:'待复核', doing:'复核中', done:'已完成', arch:'已归档' };
const STATUS_CLASS={ wait:'st-wait', doing:'st-doing', done:'st-done', arch:'st-arch' };

const state={ role:'legal', search:'', type:'all', status:'all', onlyReview:false, archTarget:null, sortKey:'time', sortDir:'desc' };

/* ============ 渲染 ============ */
function visibleTasks(){
  let list = TASKS.slice();
  if(state.role==='procurement') list = list.filter(t=>t.owner==='procurement');
  if(state.type!=='all') list = list.filter(t=>t.type===state.type);
  if(state.status!=='all') list = list.filter(t=>t.status===state.status);
  if(state.onlyReview) list = list.filter(t=>t.review>0);
  const q=state.search.trim().toLowerCase();
  if(q) list = list.filter(t=>(t.name+t.contract+t.supplier).toLowerCase().includes(q));
  if(state.sortKey==='time'){
    list.sort((a,b)=> state.sortDir==='asc' ? a.time.localeCompare(b.time) : b.time.localeCompare(a.time));
  }
  return list;
}

function toggleSort(key){
  if(state.sortKey===key){ state.sortDir = state.sortDir==='asc'?'desc':'asc'; }
  else { state.sortKey=key; state.sortDir='desc'; }
  updateSortInd();
  renderTable();
}
function updateSortInd(){
  const ind=document.getElementById('timeInd');
  ind.textContent = (state.sortKey==='time') ? (state.sortDir==='asc'?'▲':'▼') : '';
}

function renderStats(list){
  document.getElementById('stTotal').textContent=list.length;
  document.getElementById('stWait').textContent=list.filter(t=>t.status==='wait').length;
  document.getElementById('stReview').textContent=list.reduce((s,t)=>s+t.review,0);
}
function renderTable(){
  updateSortInd();
  const list=visibleTasks();
  renderStats(list);
  const body=document.getElementById('taskBody');
  if(!list.length){ body.innerHTML=''; document.getElementById('emptyTip').style.display='block'; return; }
  document.getElementById('emptyTip').style.display='none';
  body.innerHTML=list.map(t=>{
    const canExport = state.role!=='procurement';
    const canArch = state.role==='admin';
    const reviewBadge = t.review>0 ? '<span class="tag t-review">⚠ '+t.review+'</span>' : '<span style="color:var(--ink-3)">—</span>';
    const ops = '<div class="op">'
      + '<a class="btn btn-sm btn-primary" href="page5.html?role='+encodeURIComponent(state.role)+'">继续复核</a>'
      + (canExport?'<button class="btn btn-sm" onclick="toast(\'已导出复核报告（演示）\')">导出</button>':'')
      + (canArch?'<button class="btn btn-sm" onclick="askArchive(\''+t.id+'\')">归档</button>':'')
      + '</div>';
    return '<tr>'
      + '<td><b>'+t.name+'</b><div style="color:var(--ink-3);font-size:11px;">'+t.id+'</div></td>'
      + '<td>'+t.contract+'</td>'
      + '<td class="code">'+t.code+'</td>'
      + '<td>'+t.supplier+'</td>'
      + '<td><span class="tag t-type">'+TYPE_LABEL[t.type]+'</span></td>'
      + '<td><span class="tag '+STATUS_CLASS[t.status]+'">'+STATUS_LABEL[t.status]+'</span></td>'
      + '<td>'+reviewBadge+'</td>'
      + '<td style="color:var(--ink-3);">'+t.time+'</td>'
      + '<td>'+ops+'</td>'
      + '</tr>';
  }).join('');
}
function applyPermHint(){
  const map={procurement:'采购专员：仅可见自建任务，无导出/归档权限',legal:'法务审核员：全量任务，可复核与导出',admin:'管理员：全量管理，可强制归档'};
  document.getElementById('permHint').textContent=map[state.role];
  document.getElementById('roleSel').value=state.role;
  document.querySelectorAll('.sb-admin-only').forEach(el=>{ el.style.display = state.role==='admin'?'flex':'none'; });
}
/* ============ 弹窗/提示 ============ */
function showModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function askArchive(id){ state.archTarget=id; showModal('archMask'); }
function doArchive(){
  closeModal('archMask');
  const t=TASKS.find(x=>x.id===state.archTarget);
  if(t) t.status='arch';
  state.archTarget=null;
  renderTable();
  toast('已强制归档（演示）');
}
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}
/* ============ 绑定 ============ */
const NAV = {
  ledger:{url:'page1.html'},
  tasks:{page:true},
  new:{url:'page4.html'},
  std:{url:'page6.html'},
  risk:{url:'page9.html'},
  eval:{url:'page10.html'},
  qc:{url:'page11.html'}, truthWO:{url:'page14.html'},
  rule:{url:'page12.html'},
  archive:{url:'page13.html'},
  detail:{url:'page2.html'},
  review:{url:'page5.html'},
  clauseDetail:{url:'page7.html'},
  reportDetail:{url:'page8.html'},

  setting:{}
};
function go(url){ window.location.href = url + (url.indexOf('?')>-1?'&':'?') + 'role=' + state.role; }

function bind(){
  document.getElementById('searchInput').addEventListener('input',e=>{state.search=e.target.value;renderTable();});
  document.getElementById('typeSel').addEventListener('change',e=>{state.type=e.target.value;renderTable();});
  document.getElementById('statusSel').addEventListener('change',e=>{state.status=e.target.value;renderTable();});
  document.getElementById('onlyReview').addEventListener('change',e=>{state.onlyReview=e.target.checked;renderTable();});
  document.getElementById('roleSel').addEventListener('change',e=>{state.role=e.target.value;applyPermHint();renderTable();});
  document.getElementById('newBtn').addEventListener('click',()=>{ window.location.href='page4.html?role='+encodeURIComponent(state.role); });
  document.getElementById('thTime').addEventListener('click',()=>toggleSort('time'));
  document.getElementById('sbToggle').addEventListener('click',()=>{ document.getElementById('sidebar').classList.toggle('collapsed'); });
  document.querySelectorAll('.sb-item[data-nav], .sb-sub[data-nav]').forEach(it=>{
    it.addEventListener('click',()=>{
      const nav=it.dataset.nav; const cfg=NAV[nav];
      if(cfg&&cfg.page) return;
      if(cfg&&cfg.url){ go(cfg.url); return; }
      toast('「'+(it.querySelector('span:last-child')?it.querySelector('span:last-child').textContent:'')+'」模块暂未开放');
    });
  });
}
const _ur=new URLSearchParams(location.search).get('role');
if(_ur && ['procurement','legal','admin'].includes(_ur)){ state.role=_ur; }
applyPermHint();
bind();
renderTable();
</script>

<script>
(function(){
  function toggleGroup(p){
    var g=p.closest('.sb-group');
    if(!g) return;
    var willOpen=!g.classList.contains('open');
    document.querySelectorAll('#sbNav .sb-group').forEach(function(x){x.classList.remove('open');});
    if(willOpen) g.classList.add('open');
  }
  document.querySelectorAll('#sbNav .sb-group > .sb-parent').forEach(function(p){
    p.addEventListener('click', function(){ toggleGroup(p); });
  });
  // 初始：仅展开含 active 项的组（其余折叠，满足手风琴默认折叠）
  var act=document.querySelector('#sbNav .sb-item.active, #sbNav .sb-sub.active');
  if(act){ var g=act.closest('.sb-group'); if(g) g.classList.add('open'); }
})();
</script>
