<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双盲审核工单 · 合同比对助手</title>
<script src="tailwind.js"></script>
<style>
  :root{
    --brand:#165DFF; --brand-weak:#E8F3FF; --ink-1:#1D2129; --ink-2:#4E5969; --ink-3:#86909C;
    --line:#E5E6EB; --bg:#F7F8FA; --card:#fff;
    --c-add:#B3E8C0; --c-del:#FFBFBF; --c-mod:#FFD9A8;
    --risk-high:#F53F3F; --risk-mid:#D25F00; --risk-low:#00875A; --risk-none:#86909C;
    --review-bg:#E9D5FF; --review-text:#6B21A8; --review-bd:#9333EA;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink-1);background:var(--bg);font-size:13px;}
  .app{display:flex;flex-direction:row;height:100vh;overflow:hidden;}
  /* 侧边导航（全站统一 9 项） */
  .sidebar{width:220px;flex:0 0 220px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .18s ease;min-height:0;}
  .sidebar.collapsed{width:64px;flex-basis:64px;}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);height:56px;white-space:nowrap;overflow:hidden;}
  .sidebar.collapsed .sb-brand span{display:none;}
  .logo{width:30px;height:30px;border-radius:6px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 30px;}
  .sb-nav{flex:1;overflow:auto;padding:8px;min-height:0;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--ink-2);cursor:pointer;margin-bottom:2px;white-space:nowrap;overflow:hidden;}
  .sb-item:hover{background:var(--bg);}
  .sb-item.active{background:var(--brand-weak);color:var(--brand);font-weight:600;}
  .sb-sub{padding-left:34px;font-size:13px;color:var(--ink-3);}
  .sb-sub .ico{opacity:.5;}
  .sb-sub:hover{background:var(--bg);}
  .sb-sub.active{background:var(--brand-weak);color:var(--brand);font-weight:600;}
  .sidebar.collapsed .sb-sub span{display:none;}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink-2);}
  .sb-item .ico{width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;}
  .sidebar.collapsed .sb-item span{display:none;}
  .sb-foot{padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);line-height:1.7;white-space:nowrap;overflow:hidden;}
  .sidebar.collapsed .sb-foot{display:none;}
  .sb-toggle{position:absolute;top:64px;left:206px;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;color:var(--ink-3);transition:left .18s ease;}
  .sidebar.collapsed .sb-toggle{left:50px;}
  /* 主区 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
  .topbar{height:56px;flex:0 0 56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;}
  .topbar h1{font-size:16px;margin:0;}
  .topbar .crumb{font-size:12px;color:var(--ink-3);margin-top:2px;}
  .top-right{display:flex;align-items:center;gap:12px;}
  .role-sel{border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:12px;color:var(--ink-1);background:#fff;}
  .content{flex:1;overflow:auto;padding:18px;}
  .lock-note{font-size:12px;color:var(--ink-3);}
  /* 锁屏 */
  .lock-screen{display:none;flex:1;align-items:center;justify-content:center;padding:40px;}
  .role-procurement .lock-screen{display:flex;}
  .role-procurement .main-view{display:none;}
  .lock-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:36px 40px;max-width:420px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.04);}
  .lock-ico{width:52px;height:52px;border-radius:50%;background:var(--review-bg);color:var(--review-text);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;}
  .lock-card h2{margin:0 0 8px;font-size:17px;}
  .lock-card p{margin:0;font-size:13px;color:var(--ink-3);line-height:1.7;}
  /* 统计卡 */
  .stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 18px;min-width:120px;}
  .stat .n{font-size:22px;font-weight:700;}
  .stat .l{font-size:12px;color:var(--ink-3);margin-top:2px;}
  .stat.add .n{color:var(--risk-low);} .stat.del .n{color:var(--risk-high);}
  .stat.mod .n{color:var(--risk-mid);} .stat.same .n{color:var(--ink-3);}
  /* 子导航（工单切换） */
  .subnav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;}
  .subnav .sn{padding:6px 16px;border-radius:6px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink-2);cursor:pointer;}
  .subnav .sn:hover{background:var(--bg);}
  .subnav .sn.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
  .sec-title{font-size:14px;font-weight:600;color:var(--ink-1);margin:18px 0 10px;display:flex;align-items:center;gap:8px;}
  .sec-title .line{width:3px;height:14px;background:var(--brand);border-radius:2px;}
  .filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:14px;}
  .f-input,.f-select{border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:13px;color:var(--ink-1);background:#fff;}
  .f-input{min-width:240px;}
  .spacer{flex:1;}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink-1);border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer;}
  .btn:hover{background:var(--bg);}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn-primary:hover{background:#0E4AD0;}
  .btn-sm{padding:3px 8px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  /* 表格 */
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
  th{background:#FAFBFC;color:var(--ink-3);font-weight:600;font-size:12px;}
  tbody tr{cursor:default;transition:background .12s;}
  tbody tr:hover{background:var(--brand-weak);}
  .op{display:flex;gap:6px;flex-wrap:wrap;}
  .empty{padding:32px;text-align:center;color:var(--ink-3);}
  /* 标签 */
  .tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;line-height:1.5;}
  .t-cat{background:#F2F3F5;color:var(--ink-2);}
  .t-risk{color:#fff;}
  .t-high{background:var(--risk-high);} .t-mid{background:var(--risk-mid);} .t-low{background:var(--risk-low);} .t-none{background:var(--risk-none);}
  .t-add{background:var(--c-add);color:var(--ink-1);}
  .t-del{background:var(--c-del);color:var(--ink-1);}
  .t-mod{background:var(--c-mod);color:var(--ink-1);}
  .t-same{background:#F2F3F5;color:var(--ink-2);}
  .t-review{background:var(--review-bg);color:var(--review-text);border:1px solid var(--review-bd);}
  .t-active{background:var(--c-add);color:var(--ink-1);}
  .t-pending{background:#FFF3E8;color:#D25F00;border:1px solid #FFD9A8;}
  .t-done{background:var(--brand-weak);color:var(--brand);border:1px solid #BEDAFF;}
  .t-arb{background:#FFECEC;color:var(--risk-high);border:1px solid #FFBFBF;}
  /* 盲审弹窗 */
  .note{background:var(--review-bg);color:var(--review-text);border:1px solid var(--review-bd);border-radius:6px;padding:8px 12px;font-size:12px;margin:10px 0;line-height:1.6;}
  .rev-switch{display:flex;gap:8px;margin:10px 0;}
  .rev-switch .rv{padding:6px 16px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;}
  .rev-switch .rv.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
  .fld{margin:10px 0;}
  .fld label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:4px;}
  .fld select,.fld textarea{border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:13px;width:100%;font-family:inherit;}
  .fld textarea{min-height:64px;resize:vertical;}
  .blk{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px;}
  .blk .bt{font-size:12px;font-weight:600;margin-bottom:8px;color:var(--ink-2);display:flex;align-items:center;gap:6px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:920px){ .two-col{grid-template-columns:1fr;} }
  /* 权限显隐 */
  .role-procurement .mgr-only{display:none;}
  .role-legal .mgr-only{display:none;}
  /* 弹窗 / toast */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:100;}
  .modal-mask.show{display:flex;}
  .modal-box{position:relative;}
  .modal{background:#fff;border-radius:8px;width:min(560px,94vw);max-height:88vh;overflow:auto;padding:22px;}
  .modal h3{margin:0 0 14px;font-size:16px;}
  .modal-close{position:absolute;top:-14px;right:-14px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:20px;line-height:1;color:var(--ink-3);cursor:pointer;border-radius:6px;z-index:2;}
  .modal-close:hover{background:#F2F3F5;color:var(--ink-1);}
  .toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(29,33,41,.92);color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;}
  .toast.show{opacity:1;}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:4px;width:30px;height:30px;cursor:pointer;color:var(--ink-2);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 30px;}
.icon-btn:hover{border-color:var(--brand);color:var(--brand);}
.topbar{gap:12px;}
.top-right{margin-left:auto;}
.sidebar.collapsed .sb-item span,.sidebar.collapsed .sb-sub span{display:none;}

  /* 二级菜单手风琴 */
  .sb-children{display:none;}
  .sb-group.open .sb-children{display:block;}
  .sb-caret{margin-left:auto;font-size:11px;line-height:1;color:var(--ink-3);transition:transform .15s;transform:rotate(0deg);}
  .sb-group.open > .sb-parent .sb-caret{transform:rotate(90deg);}
  .sb-children .sb-sub{padding-left:32px;}
  .sidebar.collapsed .sb-children{display:none!important;}
  .sidebar.collapsed .sb-caret{display:none;}

  /* ===== 双盲真值复核工单（页面14）入口与回写联动 ===== */
  .truth-sync{background:#FBF6FF;border:1px solid var(--review-bd);color:var(--ink-2);border-radius:6px;padding:9px 12px;font-size:12px;line-height:1.8;margin-bottom:12px;}
  .truth-sync b{color:var(--review-text);}
  /* 【去复核】统一白底：紫字紫框，与其余蓝色主操作按钮区分；hover 仅作极浅紫反馈 */
  .btn-truth{background:#fff;color:var(--review-text);border-color:var(--review-bd);}
  .btn-truth:hover,.btn-truth:focus-visible{background:#FBF6FF;color:var(--review-text);border-color:var(--review-bd);}
  .t-truth{background:var(--review-bg);color:var(--review-text);border:1px solid var(--review-bd);}

  /* ===== v2 统一双盲工单：弹窗隔离与保存 ===== */
  .blind-locked{background:#F7F8FA;border:1px dashed var(--line);border-radius:6px;padding:18px 16px;color:var(--ink-2);font-size:13px;line-height:1.9;margin:10px 0;}
  .rev-note{font-size:12px;color:var(--ink-3);margin:0 0 8px;}
  .save-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;}
  .save-hint{font-size:12px;color:var(--ink-3);}
  .result-line{margin-top:12px;background:var(--brand-weak);border:1px solid #BEDAFF;border-radius:6px;padding:9px 12px;font-size:12px;color:var(--brand);line-height:1.7;}
  .arb-title{font-size:13px;font-weight:700;color:var(--review-text);margin:10px 0;}
  .op .btn{white-space:nowrap;}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边导航（全站统一） -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><div class="logo">C</div><span>合同比对助手</span></div>
          <div class="sb-nav" id="sbNav">
        <div class="sb-group" data-group="ledger">
          <div class="sb-item sb-parent" data-nav="ledger"><span class="ico">▤</span><span>合同台账</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="detail"><span class="ico">›</span><span>合同详情</span></div>
          </div>
        </div>
        <div class="sb-group" data-group="tasks">
          <div class="sb-item sb-parent" data-nav="tasks"><span class="ico">☰</span><span>比对任务管理</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="new"><span class="ico">＋</span><span>新建比对任务</span></div>
            <div class="sb-sub" data-nav="review"><span class="ico">✎</span><span>对比复核页</span></div>
          </div>
        </div>
        <div class="sb-group" data-group="std">
          <div class="sb-item sb-parent" data-nav="std"><span class="ico">📘</span><span>标准条款库</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="clauseDetail"><span class="ico">›</span><span>条款详情&amp;版本对比</span></div>
          </div>
        </div>
        <div class="sb-item" data-nav="risk"><span class="ico">⚠</span><span>风险条款库</span></div>
        <div class="sb-item" data-nav="eval"><span class="ico">📊</span><span>评测集管理</span></div>
        <div class="sb-group" data-group="qc">
          <div class="sb-item sb-parent active" data-nav="qc"><span class="ico">✓</span><span>双盲审核工单</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="truthWO" title="复核工单详情"><span class="ico">›</span><span>复核工单详情</span></div>
          </div>
        </div>
        <div class="sb-group" data-group="archive">
          <div class="sb-item sb-parent" data-nav="archive"><span class="ico">🗄</span><span>复核报告归档</span><span class="sb-caret">▸</span></div>
          <div class="sb-children">
            <div class="sb-sub" data-nav="reportDetail"><span class="ico">›</span><span>复核报告详情</span></div>
          </div>
        </div>
        <div class="sb-item" data-nav="rule"><span class="ico">⚙</span><span>风控规则配置</span></div>
        <div class="sb-item sb-admin-only" data-nav="setting" style="display:none;"><span class="ico">⚷</span><span>系统权限设置</span></div>
      </div>
  </aside>
  <div class="main">
    <div class="topbar">
        <button class="icon-btn" id="sbToggle" title="收起/展开侧边栏">☰</button>
        <button class="icon-btn" id="backBtn" title="返回上一页" onclick="history.back()">‹</button>
      <div>
        <h1>双盲审核工单</h1>
        <div class="crumb">合同比对助手 / 双盲审核工单（二期质量闭环）</div>
      </div>
      <div class="top-right">
        <span class="lock-note" id="permHint"></span>
        <label class="lock-note" for="identitySel">当前登录人</label>
        <select class="role-sel" id="identitySel">
          <option value="A">阅卷人 A</option>
          <option value="B">阅卷人 B</option>
          <option value="arbitrator">评测仲裁管理员</option>
          <option value="legal">法务业务角色（无权限）</option>
        </select>
        <label class="lock-note">角色</label>
        <select class="role-sel" id="roleSel">
          <option value="procurement">采购专员</option>
          <option value="legal" selected>法务审核员</option>
          <option value="admin">管理员</option>
        </select>
      </div>
    </div>

    <div class="content">
      <!-- 采购无权限锁屏 -->
      <div class="lock-screen">
        <div class="lock-card">
          <div class="lock-ico">🔒</div>
          <h2>采购专员无访问权限</h2>
          <p>双盲审核工单为<strong>法务专家 / 管理员专用</strong>的二期质检闭环，涉及独立盲审与分歧仲裁。请切换角色或联系管理员。</p>
        </div>
      </div>

      <!-- 主视图（法务 / 管理员） -->
      <div class="main-view">
        <!-- 页面14 真值回写联动提示 -->
        <div class="truth-sync" id="truthSync" style="display:none;"></div>
        <!-- 统计 -->
        <div class="stats" id="stats"></div>

        <!-- 工单切换 -->
        <div class="subnav" id="tabNav">
          <div class="sn active" data-tab="blind">待办工单</div>
          <div class="sn" data-tab="arb">仲裁列表</div>
          <div class="sn" data-tab="done">已完成工单</div>
        </div>

        <!-- 工单列表 -->
        <div class="card">
          <table>
            <thead>
              <tr><th>工单编号</th><th>来源合同</th><th>差异条款</th><th>状态</th><th>标注进度</th><th>操作</th></tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="empty" id="emptyTip" style="display:none;">该分类下暂无工单</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 盲审弹窗 -->
<div class="modal-mask" id="blindMask">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('blindMask')" aria-label="关闭">×</button>
    <div class="modal" id="blindBody"></div>
  </div>
</div>
<!-- 仲裁弹窗 -->
<div class="modal-mask" id="arbMask">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('arbMask')" aria-label="关闭">×</button>
    <div class="modal" id="arbBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const NAV = {
  ledger:{url:'page1.html'},
  tasks:{url:'page3.html'},
  new:{url:'page4.html'},
  std:{url:'page6.html'},
  risk:{url:'page9.html'},
  eval:{url:'page10.html'},
  qc:{page:true}, truthWO:{url:'page14.html'},
  rule:{url:'page12.html'},
  archive:{url:'page13.html'},
  detail:{url:'page2.html'},
  review:{url:'page5.html'},
  clauseDetail:{url:'page7.html'},
  reportDetail:{url:'page8.html'},

  setting:{}
};
const ROLE_LABEL = {procurement:'采购专员（无访问权限）', legal:'法务审核员（可盲审 / 仲裁）', admin:'管理员（可盲审 / 仲裁）'};

/* ==========================================================================
   统一双盲工单契约 v2（【页面11】/【页面14】共用，文本必须逐字一致）
   - 所有工单统一为双盲工单：A / B 两方独立标注，互相不可见对方标注内容
   - 双方均保存后自动比对：一致 →【已完成】+ 生成标准真值回写评测集；
     不一致 →【待仲裁】，由评测仲裁管理员录入最终仲裁真值
   - 全程屏蔽模型判定结论：modelSnapshot 仅作后台配对数据，绝不进入任何 DOM
   - 不再存在单人标注工单 / 单人真值
   ========================================================================== */
const WO_KEY='CLM_TRUTH_WO_V1';
const RESULT_KEY='CLM_TRUTH_RESULT_V1';
const IDENTITY_KEY='CLM_BLIND_IDENTITY_V1';
const BLIND_RESULT_KEY='CLM_BLIND_RESULT_V1';

const ST_LABEL={add:'新增',del:'删除',mod:'修改',same:'一致'};
const RISK_VALUES=['高','中','低','无风险'];
const RISK_TO_CODE={'高':'high','中':'mid','低':'low','无风险':'none'};
const CODE_TO_RISK={high:'高',mid:'中',low:'低',none:'无风险'};
const RISK_TAG={'高':'t-high','中':'t-mid','低':'t-low','无风险':'t-none'};
const WO_STATUS={blind:'待双盲',arb:'待仲裁',done:'已完成'};

/* ===== 存储层：内存权威 + localStorage 尽力持久化 + 旧格式兼容 ===== */
let _woCache=null,_resultCache=null;
function safeRead(k){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):null; }catch(e){ return null; } }
function safeWrite(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function riskNorm(r){ return CODE_TO_RISK[r]||r||''; }
function normalizeWO(w){
  const out=Object.assign({},w);
  if(out.status==='pending'||out.status==='复核完成') out.status='blind';
  if(!['blind','arb','done'].includes(out.status)) out.status='blind';
  if(!out.annotations||Array.isArray(out.annotations)){
    const a={A:null,B:null};
    (Array.isArray(out.annotations)?out.annotations:[]).forEach(x=>{
      const k=/B/.test(String(x.reviewer||''))?'B':'A';
      a[k]={type:x.type||'',risk:riskNorm(x.risk),note:x.note||'',time:x.time||'',saved:true};
    });
    ['A','B'].forEach(k=>{
      const old=out[k];
      if(old&&!a[k]) a[k]={type:old.type||'',risk:riskNorm(old.risk),note:old.note||'',time:old.time||'',saved:!!old.done};
    });
    out.annotations=a;
  }
  ['A','B'].forEach(k=>{ const a=out.annotations[k]; if(a&&a.risk) a.risk=riskNorm(a.risk); });
  if(out.truth){
    out.truth.risk=riskNorm(out.truth.risk);
    if(out.truth.source==='单人真值') out.truth.source='双人一致';
  }
  if(!out.modelSnapshot) out.modelSnapshot=MODEL_SNAPSHOTS[out.diff]||MODEL_SNAPSHOTS.d1;
  if(!out.contract) out.contract=out.src||'HT-SUP-2026-001';
  return out;
}
function allWOs(){
  if(!_woCache){
    const base=WO_SEED.map(w=>JSON.parse(JSON.stringify(w)));
    const saved=safeRead(WO_KEY);
    if(Array.isArray(saved)) saved.forEach(s=>{
      const n=normalizeWO(s); const i=base.findIndex(w=>w.id===n.id);
      if(i>=0) base[i]=Object.assign(base[i],n); else base.push(n);
    });
    _woCache=base;
  }
  return _woCache;
}
function allResults(){ if(!_resultCache){ const a=safeRead(RESULT_KEY); _resultCache=Array.isArray(a)?a:[]; } return _resultCache; }
function persist(){ safeWrite(WO_KEY,allWOs()); }   // 不覆盖已有真值回写结果
function findWO(id){ return allWOs().find(w=>w.id===id)||null; }
function nowStr(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===== 当前登录人：阅卷人 A / B / 仲裁管理员 / 法务（无权限） =====
   URL 参数只在首次解析时生效并缓存，之后以用户在顶栏切换的身份为准，
   避免 URL 里的 reviewer 参数把用户切换回原身份。 */
let _identity=null;
function currentIdentity(){
  if(_identity) return _identity;
  const p=new URLSearchParams(location.search);
  const ev=p.get('evalRole');
  let v=null;
  if(ev==='arbitrator') v='arbitrator';
  else if(ev==='legal') v='legal';
  else {
    const r=p.get('reviewer');
    if(r==='A'||r==='B') v=r;
    else if(ev==='annotator'){
      const st=safeRead(IDENTITY_KEY); v=(st==='A'||st==='B')?st:'A';
    } else {
      const st=safeRead(IDENTITY_KEY);
      v=['A','B','arbitrator','legal'].includes(st)?st:'A';
    }
  }
  _identity=v; safeWrite(IDENTITY_KEY,v);
  return v;
}
function setIdentity(v){ if(['A','B','arbitrator','legal'].includes(v)){ _identity=v; safeWrite(IDENTITY_KEY,v); } }
function isArbitrator(){ return currentIdentity()==='arbitrator'; }
function isLegal(){ return currentIdentity()==='legal'; }
function currentReviewer(){ const i=currentIdentity(); return (i==='A'||i==='B')?i:'A'; }
function identityLabel(){ return IDENTITY_LABEL[currentIdentity()]||'阅卷人 A'; }
function myAnnotation(w){ return (w.annotations||{})[currentReviewer()]||null; }
function bothSaved(w){ const a=w.annotations||{}; return !!(a.A&&a.A.saved&&a.B&&a.B.saved); }

/* ===== 真值回写：仅写评测集链路，不反向修改风险条款库业务样本 ===== */
function writeTruthResult(w){
  const ms=w.modelSnapshot||{},t=w.truth||{};
  const rec={woId:w.id,sampleId:w.sampleId,riskSampleId:w.riskSampleId,stdClause:w.stdClause,
    clause:w.clause,diff:w.diff,
    truth:{type:t.type,risk:t.risk,riskCode:RISK_TO_CODE[t.risk]||'none',note:t.note||''},
    modelSnapshot:{type:ms.type||'mod',risk:ms.risk||'中',riskCode:RISK_TO_CODE[ms.risk]||'mid',ruleNo:ms.ruleNo||'',basis:ms.basis||''},
    pairedAt:nowStr(),source:t.source||'双人一致',final:true,scope:'eval-only'};
  const list=allResults(); const i=list.findIndex(x=>x.woId===w.id);
  if(i<0) list.push(rec); else list[i]=rec;
  _resultCache=list; safeWrite(RESULT_KEY,list);
  /* 兼容【页面10】从【页面12】纳入的 EV-TR 样本统计（同一结论写一份轻量记录） */
  try{
    const bl=JSON.parse(localStorage.getItem(BLIND_RESULT_KEY)||'[]');
    const r2={sampleId:w.sampleId,woId:w.id,type:t.type,risk:RISK_TO_CODE[t.risk]||'none',time:nowStr(),source:t.source||'双人一致'};
    const j=bl.findIndex(x=>x.sampleId===w.sampleId&&x.woId===w.id);
    if(j<0) bl.push(r2); else bl[j]=r2;
    localStorage.setItem(BLIND_RESULT_KEY,JSON.stringify(bl));
  }catch(e){}
}

/* ===== 流转：双方均保存后自动比对 ===== */
function settleWorkOrder(w){
  const a=w.annotations||{A:null,B:null};
  if(w.status==='done') return 'done';
  if(!(a.A&&a.A.saved&&a.B&&a.B.saved)) return 'pending';
  if(a.A.type===a.B.type&&a.A.risk===a.B.risk){
    w.status='done';
    w.truth={type:a.A.type,risk:a.A.risk,note:'',source:'双人一致',by:'A / B 双人盲审',time:nowStr()};
    writeTruthResult(w);
    return 'agree';
  }
  w.status='arb'; w.truth=null;
  return 'conflict';
}
function saveAnnotation(w,type,risk,note){
  if(w.status==='done') return {ok:false,msg:'该工单已完成，不可重复标注'};
  if(w.status==='arb') return {ok:false,msg:'双方结论不一致，工单已转【待仲裁】，请由仲裁管理员裁定'};
  if(isLegal()) return {ok:false,msg:'法务业务角色无评测链路权限'};
  if(isArbitrator()) return {ok:false,msg:'仲裁管理员不参与盲审标注，请直接录入最终仲裁真值'};
  w.annotations=w.annotations||{A:null,B:null};
  w.annotations[currentReviewer()]={type:type,risk:risk,note:note||'',time:nowStr(),saved:true};
  const outcome=settleWorkOrder(w);
  persist();
  return {ok:true,outcome:outcome};
}
function finalArbitration(w,type,risk,note){
  if(!isArbitrator()) return {ok:false,msg:'仅评测仲裁管理员可录入最终仲裁真值'};
  w.status='done';
  w.truth={type:type,risk:risk,note:note||'',source:'负责人仲裁',by:'评测仲裁管理员',time:nowStr()};
  writeTruthResult(w); persist();
  return {ok:true,outcome:'done'};
}

/* 页面12 纳入评测集的真值样本 → 统一转成双盲工单（仍是同一份工单数据，两页互通） */
function mergeEvalTruthWOs(){
  let ts=[]; try{ ts=JSON.parse(localStorage.getItem('CLM_EVAL_TRUTH_V1')||'[]'); }catch(e){}
  if(!Array.isArray(ts)||!ts.length) return;
  const list=allWOs(); let changed=false;
  ts.forEach(t=>{
    const id='QC-TR-'+String(t.sampleId||'').replace(/[^0-9A-Za-z-]/g,'');
    if(!id||list.some(w=>w.id===id)) return;
    list.push({id:id,sampleId:t.sampleId||id,riskSampleId:t.riskSampleId||'RS-001',stdClause:t.stdClause||'CL-001',
      clause:t.clause||'评测样本',diff:t.srcCase||'d1',contract:'HT-SUP-2026-001',status:'blind',
      annotations:{A:null,B:null},truth:null,createdAt:nowStr(),
      modelSnapshot:MODEL_SNAPSHOTS[t.srcCase||'d1']||MODEL_SNAPSHOTS.d1});
    changed=true;
  });
  if(changed) persist();
}

    '<div class="two-col">'+rows+'</div>'+
    '<div class="fld"><label>最终仲裁真值 · 差异类型<span style="color:var(--risk-high);">*</span></label><select id="arbType">'+optType('','请选择差异类型')+'</select></div>'+
    '<div class="fld"><label>最终仲裁真值 · 风险等级<span style="color:var(--risk-high);">*</span></label><select id="arbRisk">'+optRisk('','请选择风险等级')+'</select></div>'+
    '<div class="fld"><label>仲裁意见</label><textarea id="arbNote" placeholder="填写统一判罚口径与依据"></textarea></div>'+
    '<div class="save-row"><button class="btn btn-primary" onclick="saveArb(\''+w.id+'\')">保存最终仲裁真值</button>'+
    '<span class="save-hint">提交后工单变为【已完成】，最终真值回写评测集样本</span></div>';
}
function buildBlind(w){
  const head='<h3>双盲阅卷 · '+esc(w.id)+'</h3>'+infoLine(w)+
    '<div class="note">全程屏蔽模型判定结论，保证盲审。阅卷人 A / B 互相看不到对方标注结果；当前登录人只能填写自己身份对应的表单。</div>';
  let body='';
  if(w.status==='done'){
    body='<div class="blk"><div class="bt">工单已完成</div><div style="line-height:1.8;color:var(--ink-2);">'+
      'A / B 双方独立标注已完成，标准真值已生成并回写评测集样本 <b class="code">'+esc(w.sampleId||'—')+'</b>。<br>'+
      '盲审隔离继续保持：此处不展示另一方标注内容，也不展示任何模型预判结果。</div></div>';
  }else if(w.status==='arb'){
    body=isArbitrator()?arbFormHtml(w):
      '<div class="blind-locked">⚖ 双方结论不一致，工单已流转至【待仲裁】。<br>'+
      '当前登录人不可查看另一方标注；请由评测仲裁管理员介入，给出最终仲裁真值。</div>';
  }else if(isArbitrator()||isLegal()){
    body='<div class="blind-locked">🔒 当前登录人为 <b>'+esc(identityLabel())+'</b>，不参与 A / B 盲审标注。<br>'+
      '请在顶栏切换为阅卷人 A 或阅卷人 B 后独立完成标注。</div>';
  }else{
    const me=currentReviewer(), locked=state.modalTab!==me;
    const tabs='<div class="rev-switch">'+
      '<div class="rv '+(state.modalTab==='A'?'active':'')+'" onclick="setModalTab(\'A\')">阅卷人 A</div>'+
      '<div class="rv '+(state.modalTab==='B'?'active':'')+'" onclick="setModalTab(\'B\')">阅卷人 B</div></div>';
    if(locked){
      body=tabs+'<div class="blind-locked">🔒 阅卷人 '+state.modalTab+' 的标注由其本人独立填写，内容对你不可见。<br>'+
        '当前登录人：<b>'+esc(identityLabel())+'</b>，请切回自己的 Tab 完成标注。</div>';
    }else{
      const mine=myAnnotation(w)||{};
      const f=state.form;
      body=tabs+'<div class="rev-note">当前以 <b>'+esc(identityLabel())+'</b> 身份独立标注'+
        (mine.saved?' · 上次保存 '+esc(mine.time||''):' · 尚未保存')+'</div>'+
        '<div class="fld"><label>差异类型<span style="color:var(--risk-high);">*</span></label><select id="blindType">'+optType(f.type||mine.type||'','请选择差异类型')+'</select></div>'+
        '<div class="fld"><label>风险等级<span style="color:var(--risk-high);">*</span></label><select id="blindRisk">'+optRisk(f.risk||mine.risk||'','请选择风险等级')+'</select></div>'+
        '<div class="fld"><label>审核意见</label><textarea id="blindNote" placeholder="填写独立判断理由">'+esc(f.note||mine.note||'')+'</textarea></div>'+
        '<div class="save-row"><button class="btn btn-primary" onclick="saveBlind(\''+w.id+'\')">保存</button>'+
        '<span class="save-hint">保存即写入工单；A / B 双方均保存后系统自动比对</span></div>';
    }
  }
  return head+body+(state.msg?'<div class="result-line">'+state.msg+'</div>':'');
}
function saveBlind(id){
  const w=findW(id); if(!w) return;
  const t=document.getElementById('blindType'),r=document.getElementById('blindRisk'),n=document.getElementById('blindNote');
  const type=t?t.value:'',risk=r?r.value:'',note=n?n.value:'';
  if(!type||!risk){ state.form={type:type,risk:risk,note:note}; toast('请先选择差异类型与风险等级（均为必填）'); return; }
  const res=saveAnnotation(w,type,risk,note);
  if(!res.ok){ toast(res.msg); return; }
  state.form={type:'',risk:'',note:''};
  state.msg=res.outcome==='agree'
    ? '✓ 双方结论一致：工单更新为【已完成】，已生成标准真值并回写评测集样本 '+esc(w.sampleId||'—')+'。'
    : res.outcome==='conflict'
      ? '⚖ 双方结论不一致：工单已流转至【待仲裁】，由评测仲裁管理员给出最终仲裁真值。'
      : '✓ 标注已保存（'+esc(identityLabel())+'）。另一处（复核工单详情）打开可看到本人记录；双方均保存后自动比对。';
  toast(res.outcome==='agree'?'结论一致，工单已完成':res.outcome==='conflict'?'结论不一致，已转待仲裁':'标注已保存');
  document.getElementById('blindBody').innerHTML=buildBlind(w);
  renderAll();
}
function saveArb(id){
  const w=findW(id); if(!w) return;
  const t=document.getElementById('arbType'),r=document.getElementById('arbRisk'),n=document.getElementById('arbNote');
  const type=t?t.value:'',risk=r?r.value:'',note=n?n.value:'';
  if(!type||!risk){ toast('请先选择最终仲裁真值的差异类型与风险等级'); return; }
  const res=finalArbitration(w,type,risk,note);
  if(!res.ok){ toast(res.msg); return; }
  state.msg='✓ 最终仲裁真值已保存：工单更新为【已完成】，真值已回写评测集样本 '+esc(w.sampleId||'—')+'。';
  toast('仲裁完成，工单已完成');
  document.getElementById('blindBody').innerHTML=buildBlind(w);
  renderAll();
}

/* 权限 / 绑定 / 初始化 */
function applyPerm(){
  document.body.classList.toggle('role-procurement',state.role==='procurement');
  document.body.classList.toggle('role-legal',state.role==='legal');
  document.body.classList.toggle('role-admin',state.role==='admin');
  document.getElementById('permHint').textContent='';   // 身份由顶栏下拉显示，避免重复文案
  document.querySelectorAll('.sb-admin-only').forEach(el=>{ el.style.display=state.role==='admin'?'flex':'none'; });
  renderAll();
}
function bind(){
  document.getElementById('tabNav').addEventListener('click',e=>{
    const sn=e.target.closest('.sn'); if(!sn) return;
    document.querySelectorAll('#tabNav .sn').forEach(x=>x.classList.remove('active'));
    sn.classList.add('active'); state.tab=sn.dataset.tab; renderTable();
  });
  document.getElementById('roleSel').addEventListener('change',e=>{ state.role=e.target.value; applyPerm(); });
  document.getElementById('identitySel').addEventListener('change',e=>{
    setIdentity(e.target.value); state.msg=''; state.form={type:'',risk:'',note:''};
    state.modalTab=currentIdentity()==='B'?'B':'A';
    const mask=document.getElementById('blindMask');
    if(mask.classList.contains('show')&&state.modalId){
      const w=findW(state.modalId); if(w) document.getElementById('blindBody').innerHTML=buildBlind(w);
    }
    applyPerm(); toast('已切换当前登录人为 '+identityLabel());
  });
  document.getElementById('sbToggle').addEventListener('click',()=>{
    const sb=document.getElementById('sidebar'); sb.classList.toggle('collapsed');
  });
  document.querySelectorAll('.sb-item[data-nav], .sb-sub[data-nav]').forEach(it=>{
    it.addEventListener('click',()=>{
      const cfg=NAV[it.dataset.nav];
      if(cfg&&cfg.page) return;
      if(cfg&&cfg.url){ go(cfg.url); return; }
      toast('演示原型：该模块暂未开放');
    });
  });
}
(function init(){
  const p=new URLSearchParams(location.search);
  const r=p.get('role'); if(r&&['procurement','legal','admin'].includes(r)){ state.role=r; document.getElementById('roleSel').value=r; }
  document.getElementById('identitySel').value=currentIdentity();
  mergeEvalTruthWOs();
  if(p.get('truthBack')==='1') setTimeout(()=>toast('已从复核工单详情返回，工单状态与标注记录已同步'),260);
  applyPerm(); bind();
})();

</script>

<script>
(function(){
  function toggleGroup(p){
    var g=p.closest('.sb-group');
    if(!g) return;
    var willOpen=!g.classList.contains('open');
    document.querySelectorAll('#sbNav .sb-group').forEach(function(x){x.classList.remove('open');});
    if(willOpen) g.classList.add('open');
  }
  document.querySelectorAll('#sbNav .sb-group > .sb-parent').forEach(function(p){
    p.addEventListener('click', function(){ toggleGroup(p); });
  });
  // 初始：仅展开含 active 项的组（其余折叠，满足手风琴默认折叠）
  var act=document.querySelector('#sbNav .sb-item.active, #sbNav .sb-sub.active');
  if(act){ var g=act.closest('.sb-group'); if(g) g.classList.add('open'); }
})();
</script>
